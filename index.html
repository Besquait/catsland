<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cats Land — диз-док</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F2;--card:#FFFFFF;--ink:#2A2622;--ink2:#6E675F;--ink3:#A8A097;--line:#ECE7E0;--accent:#F08A4B;--accent2:#FFF1E7;
  --idea:#9B8CFF;--work:#F2B33D;--done:#46B37A;--redo:#E5625C;--shadow:0 8px 30px rgba(50,35,20,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#191816;--card:#232120;--ink:#F0ECE6;--ink2:#B3ACA2;--ink3:#7A7369;--line:#322F2B;--accent:#F49A5F;--accent2:#3A2A1F;--shadow:0 8px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.logo{font-weight:800;font-size:20px;padding:4px 10px 18px}
.logo span{color:var(--accent)}
.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink2);cursor:pointer;font-weight:600}
.nl:hover{background:var(--card)}
.nl.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nl .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nl .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .c{font-size:12px;color:var(--ink3)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:18px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.lbl button{color:var(--accent);font-size:20px;line-height:1;padding:0 4px}
.foot{margin-top:auto;padding:14px 10px 0;font-size:13px;color:var(--ink3);display:flex;flex-direction:column;gap:4px}
.foot a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sync{display:flex;gap:7px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--done)}
.sync i.busy{background:var(--work)} .sync i.err{background:var(--redo)}
main{padding:44px 40px 120px}
.page{max-width:860px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.emoji{font-size:40px;cursor:pointer;border-radius:12px;padding:2px 6px}
.emoji:hover{background:var(--card)}
.title{flex:1;font-size:34px;font-weight:800;border:0;background:none;outline:none;padding:0;min-width:0}
.sub{color:var(--ink2);margin:0 0 26px}
.status{display:flex;gap:6px;margin:0 0 26px;flex-wrap:wrap}
.status button{padding:5px 12px;border-radius:20px;font-size:14px;font-weight:700;color:var(--ink2);border:1.5px solid var(--line);background:var(--card)}
.status button.on{color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .hint{font-size:13px;color:var(--ink3);margin:0 0 8px}
.card h3 .x{margin-left:auto;color:var(--ink3);font-weight:600;font-size:13px;opacity:0}
.card:hover h3 .x{opacity:1}
textarea.f{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:52px;padding:0;line-height:1.6;overflow:hidden}
textarea.f::placeholder,.it textarea::placeholder{color:var(--ink3)}
.cl{display:flex;flex-direction:column;gap:2px}
.it{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.it input[type=checkbox]{appearance:none;width:18px;height:18px;border:2px solid var(--ink3);border-radius:6px;margin-top:4px;flex:none;cursor:pointer;display:grid;place-items:center}
.it input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
.it input[type=checkbox]:checked:after{content:"✓";color:#fff;font-size:12px;font-weight:800}
.it textarea{flex:1;border:0;outline:none;background:transparent;resize:none;padding:0;line-height:1.6;min-height:25px;overflow:hidden}
.it.done textarea{color:var(--ink3);text-decoration:line-through}
.it .del{color:var(--ink3);opacity:0;font-size:18px;line-height:1}
.it:hover .del{opacity:1}
.add{color:var(--ink3);font-size:14px;font-weight:700;padding:4px 0;text-align:left}
.add:hover{color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.s{width:92px;text-align:center;font-size:12px;color:var(--ink2)}
.s label{display:block;width:92px;height:64px;border-radius:12px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);position:relative}
.s input[type=color]{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.s input.n{width:100%;border:0;background:none;text-align:center;outline:none;font-size:12px;margin-top:4px;color:var(--ink2)}
.s .rm{font-size:11px;color:var(--ink3)}
.addc{width:92px;height:64px;border-radius:12px;border:2px dashed var(--line);color:var(--ink3);font-size:24px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;text-align:left}
.gc:hover{border-color:var(--line)}
.gc .n{font-weight:800;font-size:17px;margin:6px 0 2px}
.gc .d{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.gc .m{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--ink3);font-weight:700}
.pill{padding:2px 9px;border-radius:10px;color:#fff;font-size:12px;font-weight:800}
.newg{border:2px dashed var(--line);box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--ink3);font-weight:800;min-height:130px;text-align:center}
.danger{color:var(--redo);font-size:14px;font-weight:700;margin-top:26px}
.banner{background:var(--accent2);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:22px}
.banner a{color:var(--accent);font-weight:700;cursor:pointer}
.menu{position:fixed;z-index:30;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;border:1px solid var(--line)}
.menu button{font-size:22px;padding:4px;border-radius:8px}
.menu button:hover{background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.3);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);border-radius:18px;padding:28px;width:420px;max-width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:22px}
.modal p{color:var(--ink2);margin:0 0 14px;font-size:14px}
.modal input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none}
.btn{background:var(--accent);color:#fff;font-weight:800;padding:9px 18px;border-radius:10px;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.burger{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;left:0;top:0;z-index:35;width:260px;background:var(--bg);transform:translateX(-102%);transition:.2s}nav.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:block;position:fixed;top:12px;left:12px;z-index:34;width:40px;height:40px;border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
  main{padding:66px 16px 100px}.grid{grid-template-columns:1fr}.title{font-size:26px}}
</style>
</head>
<body>
<button class="burger" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
<div class="app"><nav id="nav"></nav><main><div class="page" id="page"></div></main></div>
<div class="toast" id="toast"></div>
<script>
/* ===== storage: private GitHub repo, key in the link (#k=...) or localStorage ===== */
const CFG = { repo: "Besquait/catsland-gdd", branch: "main", path: "data/gdd.json" };
const H = new URLSearchParams(location.hash.slice(1));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const LSset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
if (H.get("k")) { LSset("cl_key", H.get("k")); history.replaceState(null, "", location.pathname); }
const KEY = H.get("k") || LS("cl_key");
const REMOTE = !!KEY;
const api = (p, o = {}) => fetch("https://api.github.com/repos/" + CFG.repo + p, { ...o, cache: "no-store",
  headers: { Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json" } });
const enc = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 32768) r += String.fromCharCode(...b.subarray(i, i + 32768)); return btoa(r); };
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);

let doc, base, sha = null, dirty = false, saving = false, timer = null, what = new Set();

function seed() {
  return {
    intro: { pitch: "", audience: "", loop: "", session: "", platform: "" },
    style: { palette: [{ id: uid(), c: "#F08A4B", n: "Акцент" }, { id: uid(), c: "#FFF6EC", n: "Фон" }, { id: uid(), c: "#2A2622", n: "Текст" }],
             visual: "", fonts: "", sound: "", ui: "", refs: [] },
    games: []
  };
}
function newGame() {
  return { id: uid(), emoji: "🐱", name: "Новая мини-игра", status: "idea", summary: "", rules: "", controls: "", win: "", extra: [], todo: [], redo: [] };
}

/* three-way merge: arrays of {id} merge per item, other values: local wins if it changed */
function merge(b, l, r) {
  if (Array.isArray(l) && Array.isArray(r) && l.concat(r).every(x => x && typeof x === "object" && "id" in x)) {
    const B = new Map((b || []).map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
    const out = [];
    for (const id of new Set([...l.map(x => x.id), ...r.map(x => x.id)])) {
      if (B.has(id) && (!L.has(id) || !R.has(id))) continue;
      out.push(B.has(id) ? merge(B.get(id), L.get(id), R.get(id)) : (L.get(id) || R.get(id)));
    }
    return out;
  }
  if (l && r && typeof l === "object" && typeof r === "object" && !Array.isArray(l)) {
    const o = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) o[k] = merge(b && b[k], l[k], r[k]);
    return o;
  }
  return JSON.stringify(l) !== JSON.stringify(b) ? l : r;
}

async function load() {
  if (!REMOTE) { const s = LS("cl_doc2"); doc = s ? JSON.parse(s) : seed(); base = clone(doc); return; }
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
  if (r.status === 404) { doc = seed(); base = seed(); save("старт"); return; }
  if (!r.ok) throw new Error(r.status === 401 ? "ключ не подходит" : "GitHub " + r.status);
  const j = await r.json(); sha = j.sha; doc = JSON.parse(dec(j.content)); base = clone(doc);
  if (!doc.games) { doc = seed(); save("новая структура"); }
}
function save(msg) {
  if (msg) what.add(msg);
  if (!REMOTE) { LSset("cl_doc2", JSON.stringify(doc)); sync("", "Сохранено в этом браузере"); return; }
  dirty = true; sync("busy", "Сохраняю…"); clearTimeout(timer); timer = setTimeout(push, 1200);
}
async function push() {
  if (saving) { timer = setTimeout(push, 700); return; }
  saving = true;
  try {
    for (let i = 0; i < 4; i++) {
      const snap = clone(doc);
      const body = { message: me() + ": " + ([...what].slice(0, 3).join(", ") || "правки"), content: enc(JSON.stringify(snap, null, 1)), branch: CFG.branch };
      if (sha) body.sha = sha;
      const r = await api("/contents/" + CFG.path, { method: "PUT", body: JSON.stringify(body) });
      if (r.ok) { sha = (await r.json()).content.sha; base = snap; what.clear(); dirty = JSON.stringify(doc) !== JSON.stringify(snap); sync("", "Сохранено"); if (dirty) timer = setTimeout(push, 500); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);
      const g = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); const j = await g.json();
      const remote = JSON.parse(dec(j.content)); doc = merge(base, doc, remote); base = remote; sha = j.sha;
      if (!typing()) render();
    }
  } catch (e) { sync("err", "Не сохранено: " + e.message); timer = setTimeout(push, 8000); }
  finally { saving = false; }
}
async function pull() {
  if (!REMOTE || dirty || saving || typing()) return;
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); if (!r.ok) return;
  const j = await r.json(); if (j.sha === sha) return;
  sha = j.sha; doc = JSON.parse(dec(j.content)); base = clone(doc); render();
}
const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"); };

/* ===== ui helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const me = () => LS("cl_name") || "Гость";
function sync(cls, t) { const el = $("#syncT"); if (!el) return; el.textContent = t; $("#syncI").className = cls; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 1800); }
const STATUS = { idea: ["Идея", "var(--idea)"], work: ["В работе", "var(--work)"], done: ["Готово", "var(--done)"], redo: ["Переделать", "var(--redo)"] };
let view = "intro";

function field(path, title, hint, ph, wide) {
  return `<div class="card${wide ? " wide" : ""}"><h3>${title}</h3>${hint ? `<p class="hint">${hint}</p>` : ""}
    <textarea class="f" data-p="${path}" placeholder="${esc(ph || "")}">${esc(get(path))}</textarea></div>`;
}
function checklist(path, title, hint, ph) {
  const list = get(path) || [];
  return `<div class="card"><h3>${title} <span style="color:var(--ink3);font-weight:700;font-size:13px">${list.filter(x => x.done).length}/${list.length}</span></h3>${hint ? `<p class="hint">${hint}</p>` : ""}
    <div class="cl">${list.map(x => `<div class="it${x.done ? " done" : ""}"><input type="checkbox" data-chk="${path}|${x.id}" ${x.done ? "checked" : ""}>
      <textarea rows="1" data-item="${path}|${x.id}" placeholder="${esc(ph)}">${esc(x.t)}</textarea><button class="del" data-del="${path}|${x.id}">×</button></div>`).join("")}</div>
    <button class="add" data-addi="${path}">+ добавить</button></div>`;
}
function get(path) { return path.split(".").reduce((o, k) => o == null ? o : (Array.isArray(o) ? o.find(x => x.id === k) : o[k]), doc); }
function setv(path, v) { const ks = path.split("."); const last = ks.pop(); get(ks.join("."))[last] = v; }
const open = g => g.todo.filter(i => !i.done).length + g.redo.filter(i => !i.done).length;

function renderNav() {
  const g = doc.games;
  $("#nav").innerHTML = `<div class="logo">Cats <span>Land</span></div>
    <div class="nl ${view === "intro" ? "on" : ""}" data-go="intro">📖 <span class="t">Введение</span></div>
    <div class="nl ${view === "style" ? "on" : ""}" data-go="style">🎨 <span class="t">Общие стили</span></div>
    <div class="lbl">Мини-игры <button data-newgame title="Добавить">+</button></div>
    <div class="nl ${view === "games" ? "on" : ""}" data-go="games">🗂️ <span class="t">Все мини-игры</span><span class="c">${g.length}</span></div>
    ${g.map(x => `<div class="nl ${view === x.id ? "on" : ""}" data-go="${x.id}"><span class="dot" style="background:${STATUS[x.status][1]}"></span><span class="t">${esc(x.emoji)} ${esc(x.name)}</span>${open(x) ? `<span class="c">${open(x)}</span>` : ""}</div>`).join("")}
    <div class="foot"><div class="sync"><i id="syncI"></i><span id="syncT">${REMOTE ? "Сохранено" : "Только этот браузер"}</span></div>
      <div>Вы: <a onclick="askName(true)">${esc(me())}</a></div>
      ${REMOTE ? `<a onclick="share()">Скопировать ссылку для своих</a>` : `<a onclick="askKey()">Подключить общий диз-док</a>`}</div>`;
}

function render() {
  if (!["intro", "style", "games"].includes(view) && !doc.games.find(g => g.id === view)) view = "games";
  renderNav();
  const P = $("#page");
  const banner = REMOTE ? "" : `<div class="banner">Сейчас правки сохраняются только в этом браузере. <a onclick="askKey()">Подключить общий диз-док</a></div>`;
  if (view === "intro") {
    P.innerHTML = banner + `<div class="head"><span class="emoji">📖</span><div class="title">Введение</div></div><p class="sub">Что за игра — коротко, чтобы новый человек понял за минуту</p>
      <div class="grid">${field("intro.pitch", "Идея в двух предложениях", "", "Cats Land — это…", true)}
      ${field("intro.audience", "Для кого", "", "Кто играет и почему")}
      ${field("intro.platform", "Платформа и формат", "", "Где играют, сколько игроков")}
      ${field("intro.loop", "Как устроена сессия", "Что игрок делает от входа до выхода", "Зашёл → выбрал мини-игру → …", true)}
      ${field("intro.session", "Общие правила для всех мини-игр", "Очки, награды, раунды — что общее", "", true)}</div>`;
  } else if (view === "style") {
    const s = doc.style;
    P.innerHTML = banner + `<div class="head"><span class="emoji">🎨</span><div class="title">Общие стили</div></div><p class="sub">Как всё выглядит и звучит — одинаково во всех мини-играх</p>
      <div class="grid"><div class="card wide"><h3>Палитра</h3><p class="hint">Нажмите на цвет, чтобы изменить</p><div class="sw">
        ${s.palette.map(p => `<div class="s"><label style="background:${p.c}"><input type="color" value="${p.c}" data-col="${p.id}"></label><input class="n" value="${esc(p.n)}" data-coln="${p.id}"><button class="rm" data-colrm="${p.id}">убрать</button></div>`).join("")}
        <button class="addc" data-coladd>+</button></div></div>
      ${field("style.visual", "Визуальный стиль", "", "Мультяшно, мягкие формы, …")}
      ${field("style.ui", "Интерфейс", "", "Кнопки, окна, иконки")}
      ${field("style.fonts", "Шрифты и текст", "", "")}
      ${field("style.sound", "Звук и музыка", "", "")}
      ${checklist("style.refs", "Референсы", "Ссылки на картинки и игры", "Ссылка или описание")}</div>`;
  } else if (view === "games") {
    P.innerHTML = banner + `<div class="head"><span class="emoji">🗂️</span><div class="title">Мини-игры</div></div><p class="sub">${doc.games.length} шт.</p>
      <div class="games">${doc.games.map(g => `<button class="gc" data-go="${g.id}"><span class="pill" style="background:${STATUS[g.status][1]}">${STATUS[g.status][0]}</span><div class="n">${esc(g.emoji)} ${esc(g.name)}</div><div class="d">${esc(g.summary) || "<span style='color:var(--ink3)'>Суть не описана</span>"}</div><div class="m"><span>доделать ${g.todo.filter(i => !i.done).length}</span><span>переделать ${g.redo.filter(i => !i.done).length}</span></div></button>`).join("")}
      <button class="gc newg" data-newgame>+ Мини-игра</button></div>`;
  } else {
    const g = doc.games.find(x => x.id === view), p = "games." + g.id;
    P.innerHTML = banner + `<div class="head"><span class="emoji" data-emoji>${esc(g.emoji)}</span><input class="title" data-p="${p}.name" value="${esc(g.name)}"></div>
      <div class="status">${Object.entries(STATUS).map(([k, [t, c]]) => `<button class="${g.status === k ? "on" : ""}" style="${g.status === k ? "background:" + c : ""}" data-status="${k}">${t}</button>`).join("")}</div>
      <div class="grid">${field(p + ".summary", "Суть", "Одно-два предложения", "Игроки … и побеждает тот, кто …", true)}
      ${field(p + ".rules", "Как работает", "Правила по шагам, цифры, тайминги", "1. …", true)}
      ${field(p + ".controls", "Управление", "", "Какие кнопки и что делают")}
      ${field(p + ".win", "Победа и поражение", "", "Когда раунд заканчивается, кто выигрывает")}
      ${checklist(p + ".todo", "Доделать", "Чего ещё нет", "Что нужно сделать")}
      ${checklist(p + ".redo", "Переделать", "Что есть, но работает не так", "Сейчас … → должно быть …")}
      ${g.extra.map(x => `<div class="card wide"><h3><input value="${esc(x.h)}" data-exh="${x.id}" style="border:0;background:none;outline:none;font:inherit;font-weight:800;flex:1" placeholder="Заголовок"><button class="x" data-exrm="${x.id}">убрать</button></h3><textarea class="f" data-p="${p}.extra.${x.id}.t" placeholder="…">${esc(x.t)}</textarea></div>`).join("")}
      </div><button class="add" style="margin-top:16px" data-exadd>+ свой раздел</button><br>
      <button class="danger" data-delgame>Удалить мини-игру</button>`;
  }
  P.querySelectorAll("textarea").forEach(grow);
}
function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
const curGame = () => doc.games.find(x => x.id === view);
const label = () => view === "intro" ? "введение" : view === "style" ? "стили" : (curGame() ? "«" + curGame().name + "»" : "мини-игры");

/* ===== events ===== */
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (t.tagName === "TEXTAREA") grow(t);
  if (d.p) { setv(d.p, t.value); if (d.p.endsWith(".name")) renderNav(); }
  else if (d.item) { const [p, id] = d.item.split("|"); get(p).find(x => x.id === id).t = t.value; }
  else if (d.col) { doc.style.palette.find(x => x.id === d.col).c = t.value; t.parentElement.style.background = t.value; }
  else if (d.coln) doc.style.palette.find(x => x.id === d.coln).n = t.value;
  else if (d.exh) curGame().extra.find(x => x.id === d.exh).h = t.value;
  else return;
  save(label());
});
document.addEventListener("keydown", e => {
  const d = e.target.dataset || {};
  if (d.item && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const [p, id] = d.item.split("|"); addItem(p, id); }
  if (d.item && e.key === "Backspace" && !e.target.value) {
    e.preventDefault(); const [p, id] = d.item.split("|"); const l = get(p); const i = l.findIndex(x => x.id === id);
    l.splice(i, 1); save(label()); render(); const prev = l[Math.max(0, i - 1)]; if (prev) focusItem(p, prev.id);
  }
});
function addItem(p, after) { const l = get(p); const it = { id: uid(), t: "", done: false }; const i = after ? l.findIndex(x => x.id === after) + 1 : l.length; l.splice(i, 0, it); save(label()); render(); focusItem(p, it.id); }
function focusItem(p, id) { const el = document.querySelector(`[data-item="${p}|${id}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-newgame],[data-status],[data-chk],[data-del],[data-addi],[data-coladd],[data-colrm],[data-exadd],[data-exrm],[data-delgame],[data-emoji]");
  if (!t) return; const d = t.dataset;
  if (d.go) { view = d.go; $("nav").classList.remove("open"); render(); scrollTo(0, 0); return; }
  if ("newgame" in d) { const g = newGame(); doc.games.push(g); view = g.id; save("новая мини-игра"); render(); const n = $(".title"); n.focus(); n.select(); return; }
  if (d.status) { curGame().status = d.status; save(label() + ": статус"); render(); return; }
  if (d.chk) { const [p, id] = d.chk.split("|"); get(p).find(i => i.id === id).done = t.checked; save(label()); render(); return; }
  if (d.del) { const [p, id] = d.del.split("|"); const l = get(p); l.splice(l.findIndex(x => x.id === id), 1); save(label()); render(); return; }
  if (d.addi) { addItem(d.addi); return; }
  if ("coladd" in d) { doc.style.palette.push({ id: uid(), c: "#CCCCCC", n: "Цвет" }); save("палитра"); render(); return; }
  if (d.colrm) { doc.style.palette = doc.style.palette.filter(x => x.id !== d.colrm); save("палитра"); render(); return; }
  if ("exadd" in d) { curGame().extra.push({ id: uid(), h: "", t: "" }); save(label()); render(); const hs = document.querySelectorAll("[data-exh]"); hs[hs.length - 1].focus(); return; }
  if (d.exrm) { const g = curGame(); g.extra = g.extra.filter(x => x.id !== d.exrm); save(label()); render(); return; }
  if ("delgame" in d) { const g = curGame(); if (!confirm("Удалить «" + g.name + "»?")) return; doc.games = doc.games.filter(x => x !== g); view = "games"; save("удалена " + g.name); render(); return; }
  if ("emoji" in d) pickEmoji(t);
});
const EM = [..."🐱🐈😺😸😼🙀🐾🧶🐟🥛🐭🦴🏃🧩🎯🎲🏆⚽🎈🎁🍰🌈⭐🔥💧🌙🌳🍄🪁🎵🚀🧊"];
function pickEmoji(el) {
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = EM.map(x => `<button>${x}</button>`).join("");
  const r = el.getBoundingClientRect(); m.style.left = r.left + "px"; m.style.top = r.bottom + 6 + "px";
  m.onclick = e => { const b = e.target.closest("button"); if (!b) return; curGame().emoji = b.textContent; m.remove(); save(label()); render(); };
  document.body.appendChild(m);
  setTimeout(() => document.addEventListener("click", function h(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener("click", h); } }), 0);
}
function modal(html, ok) {
  const w = document.createElement("div"); w.className = "modal"; w.innerHTML = `<div>${html}</div>`; document.body.appendChild(w);
  const i = w.querySelector("input"); setTimeout(() => i && i.focus(), 20);
  const go = () => { if (ok(i && i.value.trim()) !== false) w.remove(); };
  w.querySelector(".btn").onclick = go; if (i) i.onkeydown = e => { if (e.key === "Enter") go(); };
  w.onclick = e => { if (e.target === w) w.remove(); };
}
function askName(force) {
  if (!force && LS("cl_name")) return;
  modal(`<h3>Как вас подписывать?</h3><p>Имя попадёт в историю правок.</p><input value="${esc(LS("cl_name") || "")}" placeholder="Имя"><button class="btn">Готово</button>`,
    v => { if (!v) return false; LSset("cl_name", v); renderNav(); });
}
function askKey() {
  const url = "https://github.com/settings/personal-access-tokens/new?name=catsland&target_name=Besquait&expires_in=none&contents=write";
  modal(`<h3>Общий диз-док</h3><p>Если вам прислали ссылку — просто откройте её.<br><br>Владелец подключает один раз: <a href="${url}" target="_blank">создать ключ</a> → Only select repositories: <b>catsland-gdd</b> → Generate → вставить сюда.</p><input placeholder="Ключ"><button class="btn">Подключить</button>`,
    v => { if (!v) return false; LSset("cl_key", v); location.reload(); });
}
function share() { const u = location.origin + location.pathname + "#k=" + KEY; navigator.clipboard.writeText(u).then(() => toast("Ссылка скопирована"), () => prompt("Ссылка", u)); }
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  try { await load(); } catch (e) { doc = seed(); base = clone(doc); setTimeout(() => sync("err", "Нет доступа: " + e.message), 0); }
  render(); askName(false);
  if (REMOTE) setInterval(pull, 20000);
})();
</script>
