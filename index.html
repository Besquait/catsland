<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cats Land — диз-док</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* riso sticker style: cream paper, 3px ink outline, uneven corners, hard offset shadow, small tilts */
:root{--bg:#EFE6D6;--card:#FFF4E2;--ink:#1B2350;--ink2:#565C82;--ink3:#9A9AAE;--line:#D9CDB8;--edge:#1B2350;--sh:#1B2350;
  --accent:#FF5C8A;--accent2:#FFE1E9;--teal:#12B5A6;--sun:#FFC83D;
  --idea:#B38BFF;--work:#FFC83D;--done:#3CC46A;--redo:#F2553D;--shadow:4px 4px 0 var(--sh)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Rubik,system-ui,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,rgba(27,35,80,.09) 1px,transparent 1.3px);background-size:7px 7px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
nav{margin:16px 0 16px 16px;padding:20px 14px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:4px;
  background:var(--card);border:3px solid var(--edge);border-radius:14px 20px 12px 18px;box-shadow:var(--shadow)}
.logo{font:800 24px/1.05 Rubik,sans-serif;padding:4px 10px 18px;transform:rotate(-2deg);letter-spacing:.3px}
.logo span{color:var(--accent)}
.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px 12px 8px 11px;color:var(--ink2);cursor:pointer;font-weight:700;border:2.5px solid transparent;transition:transform .08s}
.nl:hover{border-color:var(--edge);color:var(--ink);transform:rotate(-.6deg)}
.nl.on{background:var(--sun);color:#1B2350;border-color:var(--edge);box-shadow:3px 3px 0 var(--sh);transform:rotate(-1deg)}
.nl .dot{width:11px;height:11px;border-radius:3px;flex:none;border:2px solid var(--edge)}
.nl .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .c{font:700 11px/1 "Martian Mono",monospace;color:inherit;opacity:.7}
.lbl{font:700 11px/1 "Martian Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:20px 10px 8px;display:flex;justify-content:space-between;align-items:center}
.lbl button{width:26px;height:26px;border-radius:7px 9px 6px 8px;background:var(--accent);color:#fff;border:2.5px solid var(--edge);box-shadow:2px 2px 0 var(--sh);font:800 16px/1 Rubik;display:grid;place-items:center;padding:0}
.lbl button:active{transform:translate(2px,2px);box-shadow:none}
.foot{margin-top:auto;padding:14px 10px 0;font-size:13px;color:var(--ink3);display:flex;flex-direction:column;gap:6px;border-top:2.5px dashed var(--line)}
.foot a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sync{display:flex;gap:7px;align-items:center;font:700 11px/1.3 "Martian Mono",monospace}
.sync i{width:9px;height:9px;border-radius:2px;border:2px solid var(--edge);background:var(--done)}
.sync i.busy{background:var(--work)} .sync i.err{background:var(--redo)}
main{padding:44px 40px 120px}
.page{max-width:880px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.emoji{font-size:40px;cursor:pointer;border-radius:12px;padding:2px 6px;border:3px solid transparent;transform:rotate(-4deg)}
.emoji:hover{border-color:var(--edge);background:var(--card);box-shadow:3px 3px 0 var(--sh)}
.title{flex:1;font:800 36px/1.1 Rubik,sans-serif;border:0;background:none;outline:none;padding:0;min-width:0;letter-spacing:-.2px}
.sub{color:var(--ink2);margin:0 0 26px}
.status{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
.status button{padding:6px 12px 5px;border-radius:9px 12px 8px 11px;font:700 12px/1.2 "Martian Mono",monospace;color:var(--ink2);border:2.5px solid var(--edge);background:var(--card)}
.status button:hover{transform:rotate(-1deg)}
.status button.on{color:#1B2350;box-shadow:3px 3px 0 var(--sh);transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--card);border:3px solid var(--edge);border-radius:14px 18px 12px 20px;padding:16px 20px 18px;box-shadow:var(--shadow);position:relative}
.grid>.card:nth-child(4n+1){transform:rotate(-.35deg)} .grid>.card:nth-child(4n+2){transform:rotate(.4deg)}
.grid>.card:nth-child(4n+3){transform:rotate(.25deg)} .grid>.card:nth-child(4n){transform:rotate(-.3deg)}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .hint{font-size:13px;color:var(--ink3);margin:0 0 8px}
.card h3 .x{margin-left:auto;color:var(--ink3);font-weight:600;font-size:13px;opacity:0}
.card:hover h3 .x{opacity:1}
textarea.f{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:52px;padding:0;line-height:1.6;overflow:hidden}
textarea.f::placeholder,.it textarea::placeholder{color:var(--ink3)}
.cl{display:flex;flex-direction:column;gap:2px}
.it{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.it input[type=checkbox]{appearance:none;width:19px;height:19px;border:2.5px solid var(--edge);border-radius:4px 6px 4px 5px;margin-top:4px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.it input[type=checkbox]:checked{background:var(--done);box-shadow:2px 2px 0 var(--sh)}
.it input[type=checkbox]:checked:after{content:"✓";color:#1B2350;font-size:12px;font-weight:900}
.it textarea{flex:1;border:0;outline:none;background:transparent;resize:none;padding:0;line-height:1.6;min-height:25px;overflow:hidden}
.it.done textarea{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.it .del{color:var(--ink3);opacity:0;font-size:18px;line-height:1}
.it .del:hover{color:var(--redo)}
.it:hover .del{opacity:1}
.add{color:var(--ink3);font:700 12px/1 "Martian Mono",monospace;padding:8px 0 2px;text-align:left}
.add:hover{color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:14px}
.s{width:92px;text-align:center;font-size:12px;color:var(--ink2)}
.s label{display:block;width:92px;height:64px;border-radius:10px 14px 9px 12px;cursor:pointer;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--sh);position:relative}
.s:nth-child(odd) label{transform:rotate(-2deg)} .s:nth-child(even) label{transform:rotate(1.5deg)}
.s input[type=color]{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.s input.n{width:100%;border:0;background:none;text-align:center;outline:none;font:700 11px/1 "Martian Mono",monospace;margin-top:8px;color:var(--ink2)}
.s .rm{font-size:11px;color:var(--ink3)}
.addc{width:92px;height:64px;border-radius:10px 14px 9px 12px;border:3px dashed var(--edge);color:var(--ink2);font:800 22px/1 Rubik}
.addc:hover{background:var(--card);color:var(--accent)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.gc{background:var(--card);border:3px solid var(--edge);border-radius:14px 18px 12px 20px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s}
.gc:nth-child(3n+1){transform:rotate(-1deg)} .gc:nth-child(3n+2){transform:rotate(.8deg)} .gc:nth-child(3n){transform:rotate(-.4deg)}
.gc:hover{transform:translate(-2px,-3px) rotate(-1.5deg);box-shadow:8px 8px 0 var(--sh)}
.gc:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--sh)}
.gc .n{font:800 17px/1.2 Rubik,sans-serif;margin:8px 0 4px}
.gc .d{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.gc .m{display:flex;gap:10px;margin-top:10px;font:700 11px/1.3 "Martian Mono",monospace;color:var(--ink3)}
.pill{padding:3px 9px 2px;border-radius:6px 8px 5px 7px;color:#1B2350;font:700 11px/1.4 "Martian Mono",monospace;border:2px solid var(--edge);display:inline-block;transform:rotate(-2deg)}
.newg{border:3px dashed var(--edge);box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--ink2);font:800 15px/1.3 Rubik;min-height:130px;text-align:center}
.newg:hover{background:var(--card);box-shadow:var(--shadow)}
.danger{color:var(--redo);font:700 12px/1 "Martian Mono",monospace;margin-top:30px}
.banner{background:var(--accent2);border:3px solid var(--edge);border-radius:12px 16px 11px 14px;box-shadow:4px 4px 0 var(--sh);padding:10px 14px;font-size:14px;margin-bottom:24px;transform:rotate(-.4deg)}
.banner a{color:var(--accent);font-weight:700;cursor:pointer}
.menu{position:fixed;z-index:30;background:var(--card);border:3px solid var(--edge);border-radius:12px 16px 11px 14px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.menu button{font-size:22px;padding:4px;border-radius:8px}
.menu button:hover{background:var(--sun)}
.modal{position:fixed;inset:0;background:rgba(27,35,80,.35);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);border:3px solid var(--edge);border-radius:16px 22px 14px 20px;padding:28px;width:430px;max-width:100%;box-shadow:7px 7px 0 var(--sh);transform:rotate(-1deg)}
.modal h3{margin:0 0 8px;font:800 22px/1.15 Rubik,sans-serif}
.modal p{color:var(--ink2);margin:0 0 14px;font-size:14px}
.modal input{width:100%;border:2.5px solid var(--edge);border-radius:9px 12px 8px 11px;padding:10px 12px;background:var(--bg);outline:none;font:700 13px/1.3 "Martian Mono",monospace}
.modal input:focus{box-shadow:3px 3px 0 var(--accent)}
.btn{background:var(--sun);color:#1B2350;font:800 15px/1 Rubik,sans-serif;padding:12px 20px 10px;border:3px solid var(--edge);border-radius:11px 15px 10px 13px;box-shadow:4px 4px 0 var(--sh);margin-top:16px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--sun);color:#1B2350;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--sh);padding:9px 16px;border-radius:10px 13px 9px 12px;font:700 12px/1.3 "Martian Mono",monospace;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.burger{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;z-index:35;width:270px;margin:12px;height:calc(100vh - 24px);transform:translateX(-110%);transition:.2s}nav.open{transform:none}
  .burger{display:block;position:fixed;top:12px;left:12px;z-index:34;width:44px;height:44px;border-radius:10px 13px 9px 12px;background:var(--sun);color:#1B2350;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--sh);font-weight:900}
  main{padding:72px 16px 100px}.grid{grid-template-columns:1fr}.grid>.card{transform:none!important}.title{font-size:26px}}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:2.5px dashed var(--line)}
.bt{flex:1;min-width:0;border:0;background:none;outline:none;font:700 15px/1.3 Rubik,sans-serif;padding:0;color:var(--ink)}
.bt::placeholder{color:var(--ink3)}
.cnt{font:700 11px/1 "Martian Mono",monospace;color:var(--ink3)}
.bc{display:flex;gap:3px;opacity:0;transition:opacity .12s}
.card:hover .bc,.card:focus-within .bc{opacity:1}
.bc button{width:27px;height:27px;border-radius:6px 8px 5px 7px;color:var(--ink2);font-size:14px;border:2px solid transparent}
.bc button:hover{border-color:var(--edge);background:var(--sun);color:#1B2350}
.bc button:disabled{opacity:.3;cursor:default}
.addbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px;color:var(--ink3);font:700 11px/1 "Martian Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.addbar button{padding:9px 14px 8px;border-radius:9px 12px 8px 11px;border:2.5px dashed var(--edge);color:var(--ink);font:700 14px/1 Rubik;text-transform:none;letter-spacing:0}
.addbar button:hover{border-style:solid;background:var(--card);box-shadow:3px 3px 0 var(--sh);transform:rotate(-1deg)}
textarea.sub{display:block;width:100%;border:0;background:none;outline:none;resize:none;padding:0;font:inherit;color:var(--ink2);overflow:hidden;margin:0 0 26px}
textarea.sub::placeholder{color:var(--ink3)}
.rich{min-height:52px;outline:none;line-height:1.6;word-break:break-word}
.rich:empty:before{content:attr(data-ph);color:var(--ink3);pointer-events:none}
.rich b,.rich strong{font-weight:700}
.rich mark{background:#FFE58A;color:inherit;padding:0 2px;border-radius:3px}
.rich h4{font:800 17px/1.3 Rubik,sans-serif;margin:10px 0 4px}
.rich ul,.rich ol{margin:4px 0;padding-left:24px}
.rich li{margin:2px 0}
.rich li::marker{font-weight:700;color:var(--accent)}
.tb{display:none;gap:3px;flex-wrap:wrap;margin:-2px 0 8px}
.tb button{min-width:28px;height:26px;padding:0 6px;border-radius:6px 8px 5px 7px;border:2px solid var(--line);font:700 13px/1 Rubik;color:var(--ink2);background:var(--bg)}
.tb button:hover{border-color:var(--edge);background:var(--sun);color:#1B2350}
.tb .f-italic{font-style:italic}.tb .f-underline{text-decoration:underline}.tb .f-strikeThrough{text-decoration:line-through}
.tb .f-mark{background:#FFE58A}
.empty{color:var(--ink3);text-align:center}
@media (max-width:820px){.bc{opacity:1}}
:root{--test:#5EC8F2}
/* floating block panel: always at the bottom of the screen */
.addbar{position:static;margin:26px auto 0;width:max-content;max-width:100%;background:var(--card);border:3px solid var(--edge);border-radius:14px 18px 12px 16px;
  box-shadow:5px 5px 0 var(--sh);padding:8px 10px;gap:6px;justify-content:center}
.addbar>span{padding:0 6px 0 2px;color:var(--ink);font:700 11px/1 "Martian Mono",monospace}
.addbar button{border:2px solid transparent;padding:7px 10px 6px;font:700 13px/1 Rubik;display:flex;gap:5px;align-items:center}
.addbar button i{font-style:normal;font-size:14px;width:16px;text-align:center}
.addbar button:hover{border-style:solid;border-color:var(--edge);background:var(--sun);color:#1B2350;box-shadow:2px 2px 0 var(--sh);transform:rotate(-1deg)}
.addbar .ready{background:var(--accent);color:#fff;border-color:var(--edge)}
.pageact{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:16px;border-top:2.5px dashed var(--line)}
.pageact button{font:700 11px/1 "Martian Mono",monospace;color:var(--ink2);padding:8px 10px;border:2px dashed var(--line);border-radius:8px}
.pageact button:hover{border-color:var(--edge);color:var(--ink)}
.pageact .danger{margin:0 0 0 auto;color:var(--redo)}
/* search + section labels */
.search{margin:0 4px 6px;padding:8px 10px;border:2.5px solid var(--edge);border-radius:9px 12px 8px 11px;background:var(--bg);outline:none;font:500 14px/1.2 Rubik}
.search:focus{box-shadow:3px 3px 0 var(--accent)}
.lbli{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;letter-spacing:inherit;text-transform:uppercase;color:inherit;padding:0}
.lbli:focus{color:var(--ink)}
.none{font-size:13px;color:var(--ink3);padding:4px 10px}
/* blocks */
.hblock{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:14px 0 -4px;padding-bottom:6px;border-bottom:3px solid var(--edge)}
.hblock:hover .bc{opacity:1}
.ht{flex:1;border:0;background:none;outline:none;font:800 24px/1.2 Rubik,sans-serif;color:var(--ink);padding:0}
.drag{cursor:grab;color:var(--ink3);padding:4px 3px;font-size:14px;user-select:none}
.card.dragging{opacity:.45}
.card.over,.hblock.over{outline:3px dashed var(--accent);outline-offset:3px}
.tone{font-size:18px;line-height:1;padding:2px}
.k-note.t-idea{background:#FFF1C9}.k-note.t-info{background:#E3F1FF}.k-note.t-question{background:#EFE4FF}.k-note.t-warn{background:#FFE1DA}.k-note.t-good{background:#DDF5E3}
.tbh{margin-left:auto;align-self:center;font:700 10px/1 "Martian Mono",monospace;color:var(--ink3)}
.tw{overflow-x:auto;margin:0 -4px}
.tw table{border-collapse:collapse;width:100%;min-width:360px}
.tw th,.tw td{border:2px solid var(--line);padding:0;vertical-align:top;position:relative}
.tw th{background:var(--sun)}
.tw th input{width:100%;border:0;background:none;outline:none;padding:7px 22px 6px 9px;font:700 13px/1.3 Rubik;color:#1B2350}
.tw td textarea{width:100%;border:0;background:none;outline:none;resize:none;padding:7px 9px;font:400 14px/1.45 Rubik;overflow:hidden;display:block;min-height:34px}
.tw td textarea:focus,.tw th input:focus{background:rgba(255,200,61,.18)}
.tw .ctl{width:30px;border:0;text-align:center;vertical-align:middle;background:none}
.tw .ctl button{font:800 15px/1 Rubik;color:var(--ink2);width:24px;height:24px;border-radius:6px}
.tw .ctl button:hover{background:var(--sun);color:#1B2350}
.x{position:absolute;right:3px;top:5px;color:var(--ink3);opacity:0;font-size:15px;line-height:1;width:18px;height:18px;border-radius:5px}
th:hover .x,tr:hover .x,figure:hover .x,.lk:hover .x,.bch:hover .x{opacity:1}
.x:hover{color:var(--redo);background:var(--bg)}
.tw .ctl .x{position:static}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.imgs figure{margin:0;position:relative;background:var(--bg);border:2.5px solid var(--edge);border-radius:8px 11px 7px 10px;overflow:hidden;box-shadow:3px 3px 0 var(--sh)}
.imgs figure:nth-child(odd){transform:rotate(-1deg)}.imgs figure:nth-child(even){transform:rotate(.8deg)}
.imgs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--line)}
.imgs .x{background:var(--card);top:6px;right:6px}
.imgs .cap{width:100%;border:0;border-top:2px solid var(--line);background:var(--card);outline:none;padding:5px 8px;font:500 12px/1.3 Rubik}
.addimg{border:2.5px dashed var(--edge);border-radius:8px 11px 7px 10px;min-height:120px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:10px;text-align:center}
.addimg button{font:700 13px/1 Rubik;padding:7px 10px;border-radius:7px;border:2px solid var(--edge);background:var(--sun);color:#1B2350}
.addimg button+button{background:var(--card);color:var(--ink)}
.addimg span{font-size:11px;color:var(--ink3)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(27,35,80,.8);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border:3px solid #fff;border-radius:10px}
.lks{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;gap:8px;align-items:center;position:relative}
.lk a,.lk .nolink{width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--edge);border-radius:6px;background:var(--sun);color:#1B2350;text-decoration:none;font-weight:800;flex:none}
.lk .nolink{background:var(--bg);color:var(--ink3);border-color:var(--line)}
.lk input{flex:1;min-width:0;border:0;border-bottom:2px dashed var(--line);background:none;outline:none;padding:4px 2px;font:500 14px/1.3 Rubik}
.lk input.u{flex:1.4;color:var(--ink2);font-size:13px}
.lk .x{position:static}
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;align-items:flex-start}
.bcol{flex:1 1 0;min-width:150px;background:var(--bg);border:2.5px solid var(--edge);border-radius:10px 13px 9px 12px;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:90px}
.bcol:nth-child(1) .bch{background:#FFE1E9}.bcol:nth-child(2) .bch{background:#FFF1C9}.bcol:nth-child(3) .bch{background:#FFE1DA}.bcol:nth-child(4) .bch{background:#DDF5E3}
.bcol.over{outline:3px dashed var(--accent);outline-offset:2px}
.bch{display:flex;align-items:center;gap:6px;position:relative;border:2px solid var(--edge);border-radius:7px;padding:3px 6px}
.bch input{flex:1;min-width:0;border:0;background:none;outline:none;font:800 13px/1.3 Rubik;color:#1B2350;padding:2px 0}
.bch .x{position:static}
.kc{background:var(--card);border:2px solid var(--edge);border-radius:7px 9px 6px 8px;box-shadow:2px 2px 0 var(--sh);padding:6px 8px 4px;cursor:grab}
.kc:active{cursor:grabbing}
.kc.dragging{opacity:.4}

.kc:hover .kctl{opacity:1}

.kctl button:hover{background:var(--sun)}.kctl button:disabled{opacity:.25}
.bcol .add{align-self:flex-start;padding:4px 2px}

.viewsw button.on{background:var(--sun);color:#1B2350;box-shadow:3px 3px 0 var(--sh)}
.viewsw span{margin-left:8px;font:700 11px/1 "Martian Mono",monospace;color:var(--ink3)}
.gc .cov{margin:-16px -18px 10px;border-bottom:3px solid var(--edge);border-radius:11px 15px 0 0;overflow:hidden;aspect-ratio:16/8;background:var(--line)}
.gc .cov img{width:100%;height:100%;object-fit:cover;display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tags span{font:700 10px/1 "Martian Mono",monospace;padding:4px 6px 3px;border:1.5px solid var(--edge);border-radius:5px;background:var(--bg)}
.bar{position:relative;height:16px;border:2px solid var(--edge);border-radius:5px;background:var(--bg);margin-top:10px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--done)}
.bar b{position:relative;display:block;text-align:center;font:700 10px/12px "Martian Mono",monospace;color:#1B2350}
.sboard{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.scol{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;gap:14px;min-height:160px;padding:10px;border:2.5px dashed var(--line);border-radius:12px}
.scol.over{border-color:var(--accent);background:rgba(255,92,138,.06)}
.sch{display:flex;align-items:center;gap:7px;font:800 14px/1.2 Rubik}
.sch .dot{width:12px;height:12px;border-radius:3px;border:2px solid var(--edge)}
.sch .cnt{margin-left:auto}
.scol .gc{transform:none!important}
.hint2{font:700 11px/1.4 "Martian Mono",monospace;color:var(--ink3);text-align:center}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:-14px 0 26px}
.tagrow button{font:700 11px/1 "Martian Mono",monospace;padding:6px 9px 5px;border:2px dashed var(--line);border-radius:7px;color:var(--ink3)}
.tagrow button.on{border:2px solid var(--edge);background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--sh)}
/* menus */
.bmenu{position:fixed;z-index:45;width:240px;max-height:320px;overflow:auto;background:var(--card);border:3px solid var(--edge);border-radius:12px 15px 11px 14px;box-shadow:5px 5px 0 var(--sh);padding:6px;display:flex;flex-direction:column}
.bmenu button{display:flex;gap:8px;align-items:center;text-align:left;padding:7px 8px;border-radius:7px;font:500 14px/1.2 Rubik}
.bmenu button i{font-style:normal;width:20px;text-align:center}
.bmenu button.sel,.bmenu button:hover{background:var(--sun);color:#1B2350}
.modal>div.tpl{width:680px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:60vh;overflow:auto;padding:4px}
.tgrid button{text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px;border:2.5px solid var(--edge);border-radius:10px 13px 9px 12px;background:var(--bg);transition:transform .08s}
.tgrid button:hover{background:var(--sun);color:#1B2350;transform:rotate(-1deg) translate(-1px,-2px);box-shadow:3px 3px 0 var(--sh)}
.tgrid span{font-size:24px}.tgrid b{font:800 15px/1.2 Rubik}.tgrid small{font-size:12px;color:var(--ink2)}
@media (max-width:820px){.addbar{bottom:8px;padding:6px}.addbar>span{display:none}.addbar button{padding:6px 7px;font-size:12px}}
.fbar{position:fixed;bottom:16px;left:calc(50% + 143px);transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:#1B2350;border:3px solid #1B2350;border-radius:14px 18px 12px 16px;box-shadow:0 6px 18px rgba(27,35,80,.25);max-width:calc(100vw - 32px)}

.fbar .sep{width:2px;align-self:stretch;background:rgba(255,244,226,.25);margin:2px 2px}
.fbar .dadd{padding:0 12px}
main{padding-bottom:140px}
@media (max-width:820px){.fbar{left:50%;bottom:10px}.fgrp button{min-width:30px;padding:0 6px}}
.it .itx{flex:1;min-width:0;min-height:25px;line-height:1.6;outline:none;padding:0}
.it.done .itx{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}

<script>

/* ===== blocks and templates ===== */

const TX = (title, ph, wide) => B("text", title, { ph, wide: !!wide, text: "" });

}

  ["🐱", "Персонаж", "Внешность, характер, способности", () => [IM("Как выглядит"), TX("Характер", "Какой он, как двигается…"), CL("Анимации", "Анимация", ["Бег", "Прыжок", "Победа"]), TB_("Способности", ["Способность", "Что делает", "Перезарядка"]), TB_("Звуки", ["Когда", "Какой звук"])]],
  ["🗺️", "Локация / карта", "Мудборд, зоны, опасности", () => [IM("Мудборд"), TX("Описание", "Где мы и что вокруг", true), TB_("Зоны", ["Зона", "Что тут происходит", "Опасности"]), CL("Читаемость", "Проверка", ["Видно, куда бежать", "Опасности заметны заранее"])]],
  ["🎁", "Предметы и награды", "Таблица предметов", () => [TB_("Предметы", ["Предмет", "Редкость", "Как получить", "Что даёт"]), NT("info", "Правила выдачи")]],
  ["🖥️", "Интерфейс", "Экраны, HUD, тексты", () => [IM("Макеты"), CL("Элементы HUD", "Элемент", ["Таймер", "Уровень", "Сколько осталось игроков"]), TB_("Экраны", ["Экран", "Что показывает", "Когда появляется"]), TB_("Тексты", ["Где", "Текст"])]],
  ["🎨", "Арт-стиль", "Мудборд, палитра, можно/нельзя", () => [IM("Мудборд"), PL("Палитра", [["#FFF4E2", "Фон"], ["#1B2350", "Контур"], ["#FF5C8A", "Акцент"]]), CL("Можно", "Делаем так"), CL("Нельзя", "Так не делаем")]],
  ["🎵", "Звук и музыка", "События и настроение", () => [TX("Настроение", "Какая музыка, темп", true), TB_("Звуки", ["Событие", "Звук", "Заметка"]), LK("Референсы")]],
  ["🗓️", "План работ", "Доска задач и этапы", () => [KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]]), TB_("Этапы", ["Этап", "Что входит", "Срок"])]],
  ["🧪", "Плейтест", "Что заметили игроки", () => [TB_("Кто играл", ["Дата", "Игроки", "Оценка веселья (1–5)"]), CL("Понравилось", "Что зашло"), CL("Мешало", "Что не зашло"), NT("warn", "Баги", "Что сломалось"), TX("Выводы", "Что меняем", true)]],
  ["💰", "Магазин", "Товары и цены", () => [TB_("Товары", ["Товар", "Цена", "Что даёт", "Где продаётся"]), NT("info", "Принципы", "Что продаём и что никогда не продаём")]],
  ["✨", "Мудборд", "Картинки и ссылки", () => [IM("Картинки"), LK("Ссылки"), TX("Что берём", "Что нравится в этих примерах", true)]],
];
const GAME_TPL = [
  ["🎮", "Мини-игра", "Стандартный шаблон", () => [TX("Суть", "Игроки … и побеждает тот, кто …", true), IM("Как выглядит"), TX("Как работает", "1. …", true),
    READY[1][2](), READY[0][2](), TX("Победа и поражение", "Когда раунд заканчивается"), KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])]],
  ["🟨", "На выбывание", "Как Block Party: остаётся последний", () => [TX("Суть", "Кто не успел — выбывает", true), TX("Как работает", "Лобби\n1. …", true), READY[1][2](), READY[4][2](),
    NT("question", "Что происходит с выбывшими", "Смотровая площадка, наблюдение, …"), READY[9][2](), KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])]],
  ["🏁", "Гонка / паркур", "Кто первый добежит", () => [TX("Суть", "", true), IM("Трасса"), TB_("Чекпоинты", ["№", "Где", "Что сложного"]), READY[0][2](), READY[2][2](), CL("Доделать", "Что нужно сделать")]],
  ["⚔️", "Командная", "Команда против команды", () => [TX("Суть", "", true), TB_("Команды", ["Команда", "Цвет", "Сколько игроков"], [["Красные", "#F2553D", ""], ["Синие", "#3D7BF2", ""]]), TX("Цель", "Что нужно сделать команде", true),
    READY[3][2](), NT("warn", "Баланс", "Как не дать одной команде разгромить другую"), CL("Доделать", "Что нужно сделать")]],
  ["🎯", "На очки", "Кто больше наберёт за время", () => [TX("Суть", "", true), READY[3][2](), READY[1][2](), READY[2][2](), CL("Доделать", "Что нужно сделать")]],
  ["📄", "Пустая", "Только суть", () => [TX("Суть", "", true)]],
];
const STATUS = { idea: ["Идея", "var(--idea)"], work: ["В работе", "var(--work)"], test: ["Плейтест", "var(--test)"], done: ["Готово", "var(--done)"], redo: ["Переделать", "var(--redo)"] };
const TONES = { idea: ["💡", "Идея"], info: ["📌", "Заметка"], question: ["❓", "Вопрос"], warn: ["⚠️", "Важно"], good: ["✅", "Решено"] };

function page(tpl, title) { return { id: uid(), emoji: tpl[0], title: title || tpl[1], sub: "", blocks: tpl[3]() }; }
function seed() {
  const intro = { id: "intro", emoji: "📖", title: "Введение", sub: "Что за игра — коротко, чтобы новый человек понял за минуту", blocks: [TX("Идея в двух предложениях", "Cats Land — это…", true),
    TX("Для кого", "Кто играет и почему"), TX("Платформа и формат", "Где играют, сколько игроков"), TX("Как устроена сессия", "Зашёл → выбрал мини-игру → …", true), TX("Общие правила для всех мини-игр", "Очки, награды, раунды", true)] };
  const style = { id: "style", emoji: "🎨", title: "Общие стили", sub: "Как всё выглядит и звучит во всех мини-играх", blocks: [PL("Палитра", [["#FFF4E2", "Фон"], ["#1B2350", "Текст"], ["#FF5C8A", "Акцент"]]),
    TX("Визуальный стиль", "Мультяшно, мягкие формы, …"), TX("Интерфейс", "Кнопки, окна, иконки"), TX("Шрифты и текст"), TX("Звук и музыка"), IM("Референсы")] };
  return { v: 3, pagesLabel: "Диз-док", gamesLabel: "Мини-игры", pages: [intro, style], games: [] };
}

/* older documents: fixed fields (v1) -> blocks (v2) -> free pages (v3); every step is deterministic */
function migrate(d) {
  if (!d || typeof d !== "object") return seed();
  const s = seed();
  const t = (b, v) => Object.assign(b, { text: v || "" });
  const lst = (b, v) => Object.assign(b, { items: (v || []).map(x => ({ id: x.id || uid(), t: x.t || "", done: !!x.done })) });
  if (d.intro && !d.intro.blocks) { const o = d.intro, bl = s.pages[0].blocks; [o.pitch, o.audience, o.platform, o.loop, o.session].forEach((v, i) => t(bl[i], v)); d.intro = { blocks: bl }; }
  if (d.style && !d.style.blocks) { const o = d.style, bl = s.pages[1].blocks; if (o.palette) bl[0].colors = o.palette; [o.visual, o.ui, o.fonts, o.sound].forEach((v, i) => t(bl[i + 1], v)); d.style = { blocks: bl }; }
  if (!d.pages) {
    d.pages = [];
    ["intro", "style"].forEach((k, i) => { if (d[k]) { const o = d[k], sp = s.pages[i]; d.pages.push({ id: k, emoji: o.emoji ?? sp.emoji, title: o.title ?? sp.title, sub: o.sub ?? sp.sub, blocks: o.blocks || sp.blocks }); } });
    delete d.intro; delete d.style;
  }
  d.pagesLabel = d.pagesLabel ?? "Диз-док"; d.gamesLabel = d.gamesLabel ?? "Мини-игры"; d.v = 3;
  d.games = (d.games || []).map(g => {
    if (!g.blocks) {
      const bl = GAME_TPL[0][3]().filter(b => ["text", "list"].includes(b.kind));
      [g.summary, g.rules, g.controls, g.win].forEach((v, i) => bl[i] && t(bl[i], v));
      (g.extra || []).forEach(x => bl.push(TX(x.h || "", "", true)));
      g = { id: g.id, emoji: g.emoji, name: g.name, status: g.status, blocks: bl };
    }
    if (g.title == null) g.title = g.name || "Мини-игра";
    delete g.name;
    g.emoji = g.emoji || "🐱"; g.status = STATUS[g.status] ? g.status : "idea"; g.sub = g.sub ?? ""; g.tags = g.tags || [];
    return g;
  });
  d.pages.concat(d.games).forEach(p => { p.blocks = (p.blocks || []).map(norm); p.sub = p.sub ?? ""; });
  return d;
}
function norm(b) {
  const def = { text: { text: "" }, note: { text: "", tone: "idea" }, list: { items: [] }, palette: { colors: [] }, table: { cols: [], rows: [] }, images: { imgs: [] }, links: { links: [] }, board: { cols: [] }, heading: {} }[b.kind];

/* three-way merge: arrays of {id} merge per item, other values: local wins if it changed */
function merge(b, l, r) {
  if (Array.isArray(l) && Array.isArray(r) && l.concat(r).every(x => x && typeof x === "object" && "id" in x)) {
    const B = new Map((b || []).map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
    const out = [];
    for (const id of new Set([...l.map(x => x.id), ...r.map(x => x.id)])) {
      if (B.has(id) && (!L.has(id) || !R.has(id))) continue;
      out.push(B.has(id) ? merge(B.get(id), L.get(id), R.get(id)) : (L.get(id) || R.get(id)));
    }
    return out;
  }
  if (l && r && typeof l === "object" && typeof r === "object" && !Array.isArray(l)) {
    const o = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) { const v = merge(b && b[k], l[k], r[k]); if (v !== undefined) o[k] = v; }
    return o;
  }
  return JSON.stringify(l) !== JSON.stringify(b) ? l : r;
}

async function load() {
  if (!REMOTE) { const s = LS("cl_doc2"); doc = s ? JSON.parse(s) : seed(); base = clone(doc); return; }
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
  if (r.status === 404) { doc = seed(); base = seed(); save("старт"); return; }
  if (!r.ok) throw new Error(r.status === 401 ? "ключ не подходит" : "GitHub " + r.status);
  const j = await r.json(); sha = j.sha; doc = JSON.parse(dec(j.content)); base = migrate(clone(doc));
}
function save(msg) {
  if (msg) what.add(msg);
  if (!REMOTE) { sync(LSset("cl_doc2", JSON.stringify(doc)) ? "" : "err", LSset("cl_doc2", JSON.stringify(doc)) ? "Сохранено в этом браузере" : "Не влезло в память браузера"); return; }
  dirty = true; sync("busy", "Сохраняю…"); clearTimeout(timer); timer = setTimeout(push, 1200);
}
async function push() {
  if (saving) { timer = setTimeout(push, 700); return; }
  saving = true;
  try {
    for (let i = 0; i < 4; i++) {
      const snap = clone(doc);
      const body = { message: me() + ": " + ([...what].slice(0, 3).join(", ") || "правки"), content: enc(JSON.stringify(snap, null, 1)), branch: CFG.branch };
      if (sha) body.sha = sha;
      const r = await api("/contents/" + CFG.path, { method: "PUT", body: JSON.stringify(body) });
      if (r.ok) { sha = (await r.json()).content.sha; base = snap; what.clear(); dirty = JSON.stringify(doc) !== JSON.stringify(snap); sync("", "Сохранено"); if (dirty) timer = setTimeout(push, 500); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);
      const g = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); const j = await g.json();
      const remote = migrate(JSON.parse(dec(j.content))); doc = merge(base, doc, remote); base = remote; sha = j.sha;
      if (!typing()) render();
    }
  } catch (e) { sync("err", "Не сохранено: " + e.message); timer = setTimeout(push, 8000); }
  finally { saving = false; }
}
async function pull() {
  if (!REMOTE || dirty || saving || typing()) return;
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); if (!r.ok) return;
  const j = await r.json(); if (j.sha === sha) return;
  sha = j.sha; doc = migrate(JSON.parse(dec(j.content))); base = clone(doc); render();
}

/* ===== images: private repo files (gh:path) fetched with the key, or data: URLs in local mode ===== */
const IMGC = new Map();
async function imgURL(src) {
  if (!src.startsWith("gh:")) return src;
  if (IMGC.has(src)) return IMGC.get(src);
  const p = fetch(GH + "/contents/" + src.slice(3) + "?ref=" + CFG.branch, { headers: { Authorization: "Bearer " + KEY, Accept: "application/vnd.github.raw" } })
    .then(r => r.ok ? r.blob() : Promise.reject(r.status)).then(b => URL.createObjectURL(b));
  IMGC.set(src, p); return p;
}

async function shrink(file, max) {
  const bmp = await createImageBitmap(file); const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

const KEEP = new Set(["B", "STRONG", "I", "EM", "U", "S", "STRIKE", "MARK", "BR", "DIV", "P", "UL", "OL", "LI", "H4"]);
function clean(html) {
  const src = new DOMParser().parseFromString("<body>" + (html || "") + "</body>", "text/html").body;
  const walk = (node, out) => {
    for (const n of [...node.childNodes]) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1 || ["SCRIPT", "STYLE", "IFRAME", "OBJECT", "svg", "IMG"].includes(n.tagName)) continue;
      let tag = n.tagName;
      const st = n.getAttribute("style") || "", marked = /background-color:\s*rgb\(255, 229, 138\)/.test(st);
      if (tag === "SPAN" || tag === "FONT") tag = marked ? "MARK" : /font-weight:\s*(bold|[6-9]00)/.test(st) ? "B" : /italic/.test(st) ? "I" : null;
      let into = tag && KEEP.has(tag) ? out.appendChild(document.createElement(tag)) : out;
      if (marked && tag !== "MARK") into = into.appendChild(document.createElement("MARK"));   // marker applied on top of <b>, <i>, …
      walk(n, into);
    }
    return out;
  };
  return walk(src, document.createElement("div")).innerHTML.replace(/^(<br>)+$/, "");
}

function autoList(e) {

/* ===== markdown export ===== */
function mdOf(pg) {

    const w = (n, pre) => n.childNodes.forEach(c => { if (c.nodeType === 3) { o += c.nodeValue; return; } const t = c.tagName;
      if (["DIV", "P", "H4"].includes(t)) { o += "\n" + (t === "H4" ? "#### " : ""); w(c); return; } if (t === "BR") { o += "\n"; return; }
      if (t === "LI") { o += "\n" + (c.parentElement.tagName === "OL" ? [...c.parentElement.children].indexOf(c) + 1 + ". " : "- "); w(c); return; }
      const m = { B: "**", STRONG: "**", I: "_", EM: "_", S: "~~", STRIKE: "~~", MARK: "==" }[t] || ""; o += m; w(c); o += m; });

  for (const b of pg.blocks) {
    o += (b.kind === "heading" ? "## " : "### ") + (b.kind === "note" ? TONES[b.tone][0] + " " : "") + (b.title || "") + "\n\n";
    if (b.kind === "text" || b.kind === "note") o += (b.html ? md(b.text) : b.text) + "\n\n";
    if (b.kind === "list") o += b.items.map(i => `- [${i.done ? "x" : " "}] ${i.h ? md(i.t) : i.t}`).join("\n") + "\n\n";
    if (b.kind === "palette") o += b.colors.map(c => `- ${c.n}: ${c.c}`).join("\n") + "\n\n";
    if (b.kind === "table" && b.cols.length) o += "| " + b.cols.map(c => c.t).join(" | ") + " |\n|" + b.cols.map(() => " --- |").join("") + "\n" + b.rows.map(r => "| " + b.cols.map(c => ((r.c || {})[c.id] || "").replace(/\n/g, " ")).join(" | ") + " |").join("\n") + "\n\n";
    if (b.kind === "links") o += b.links.map(l => `- [${l.t || l.u}](${l.u})`).join("\n") + "\n\n";
    if (b.kind === "images") o += b.imgs.map(i => `- картинка${i.cap ? ": " + i.cap : ""}`).join("\n") + "\n\n";
    if (b.kind === "board") o += b.cols.map(c => `**${c.t}**\n` + c.cards.map(k => `- ${k.t}`).join("\n")).join("\n\n") + "\n\n";

}
function exportMD(one) {

  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));

}
