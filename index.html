<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cats Land — диз-док</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Martian+Mono:wght@700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
/* riso sticker style: cream paper, 3px ink outline, uneven corners, hard offset shadow, small tilts */
:root{--bg:#EFE6D6;--card:#FFF4E2;--ink:#1B2350;--ink2:#4A5180;--ink3:#8C8FA8;--line:#D9CDB8;--edge:#1B2350;--sh:#1B2350;
  --accent:#FF5C8A;--accent2:#FFE1E9;--teal:#12B5A6;--sun:#FFC83D;
  --idea:#B38BFF;--work:#FFC83D;--done:#3CC46A;--redo:#F2553D;--shadow:5px 5px 0 var(--sh)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#222B5E;--card:#2F3A7C;--ink:#FFF4E2;--ink2:#C9C3D8;--ink3:#8990B5;--line:#46519A;
  --edge:#05081A;--sh:#05081A;--accent2:#3A2340}}
:root[data-theme="dark"]{--bg:#222B5E;--card:#2F3A7C;--ink:#FFF4E2;--ink2:#C9C3D8;--ink3:#8990B5;--line:#46519A;--edge:#05081A;--sh:#05081A;--accent2:#3A2340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Rubik,system-ui,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,rgba(27,35,80,.09) 1px,transparent 1.3px);background-size:7px 7px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
nav{margin:16px 0 16px 16px;padding:20px 14px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:4px;
  background:var(--card);border:3px solid var(--edge);border-radius:14px 20px 12px 18px;box-shadow:var(--shadow)}
.logo{font:900 24px/1.05 Unbounded,sans-serif;padding:4px 10px 18px;transform:rotate(-2deg);letter-spacing:.3px}
.logo span{color:var(--accent);text-shadow:2px 2px 0 var(--edge)}
.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px 12px 8px 11px;color:var(--ink2);cursor:pointer;font-weight:700;border:2.5px solid transparent;transition:transform .08s}
.nl:hover{border-color:var(--edge);color:var(--ink);transform:rotate(-.6deg)}
.nl.on{background:var(--sun);color:#1B2350;border-color:var(--edge);box-shadow:3px 3px 0 var(--sh);transform:rotate(-1deg)}
.nl .dot{width:11px;height:11px;border-radius:3px;flex:none;border:2px solid var(--edge)}
.nl .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .c{font:700 11px/1 "Martian Mono",monospace;color:inherit;opacity:.7}
.lbl{font:700 11px/1 "Martian Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:20px 10px 8px;display:flex;justify-content:space-between;align-items:center}
.lbl button{width:26px;height:26px;border-radius:7px 9px 6px 8px;background:var(--accent);color:#fff;border:2.5px solid var(--edge);box-shadow:2px 2px 0 var(--sh);font:900 16px/1 Unbounded;display:grid;place-items:center;padding:0}
.lbl button:active{transform:translate(2px,2px);box-shadow:none}
.foot{margin-top:auto;padding:14px 10px 0;font-size:13px;color:var(--ink3);display:flex;flex-direction:column;gap:6px;border-top:2.5px dashed var(--line)}
.foot a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sync{display:flex;gap:7px;align-items:center;font:700 11px/1.3 "Martian Mono",monospace}
.sync i{width:9px;height:9px;border-radius:2px;border:2px solid var(--edge);background:var(--done)}
.sync i.busy{background:var(--work)} .sync i.err{background:var(--redo)}
main{padding:44px 40px 120px}
.page{max-width:880px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.emoji{font-size:40px;cursor:pointer;border-radius:12px;padding:2px 6px;border:3px solid transparent;transform:rotate(-4deg)}
.emoji:hover{border-color:var(--edge);background:var(--card);box-shadow:3px 3px 0 var(--sh)}
.title{flex:1;font:900 36px/1.1 Unbounded,sans-serif;border:0;background:none;outline:none;padding:0;min-width:0;letter-spacing:.3px;
  text-shadow:2px 1px 0 var(--accent),-1px -1px 0 var(--teal)}
.sub{color:var(--ink2);margin:0 0 26px}
.status{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
.status button{padding:6px 12px 5px;border-radius:9px 12px 8px 11px;font:700 12px/1.2 "Martian Mono",monospace;color:var(--ink2);border:2.5px solid var(--edge);background:var(--card)}
.status button:hover{transform:rotate(-1deg)}
.status button.on{color:#1B2350;box-shadow:3px 3px 0 var(--sh);transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--card);border:3px solid var(--edge);border-radius:14px 18px 12px 20px;padding:16px 20px 18px;box-shadow:var(--shadow);position:relative}
.grid>.card:nth-child(4n+1){transform:rotate(-.35deg)} .grid>.card:nth-child(4n+2){transform:rotate(.4deg)}
.grid>.card:nth-child(4n+3){transform:rotate(.25deg)} .grid>.card:nth-child(4n){transform:rotate(-.3deg)}
.grid>.card:focus-within{transform:none}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .hint{font-size:13px;color:var(--ink3);margin:0 0 8px}
.card h3 .x{margin-left:auto;color:var(--ink3);font-weight:600;font-size:13px;opacity:0}
.card:hover h3 .x{opacity:1}
textarea.f{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:52px;padding:0;line-height:1.6;overflow:hidden}
textarea.f::placeholder,.it textarea::placeholder{color:var(--ink3)}
.cl{display:flex;flex-direction:column;gap:2px}
.it{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.it input[type=checkbox]{appearance:none;width:19px;height:19px;border:2.5px solid var(--edge);border-radius:4px 6px 4px 5px;margin-top:4px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.it input[type=checkbox]:checked{background:var(--done);box-shadow:2px 2px 0 var(--sh)}
.it input[type=checkbox]:checked:after{content:"✓";color:#1B2350;font-size:12px;font-weight:900}
.it textarea{flex:1;border:0;outline:none;background:transparent;resize:none;padding:0;line-height:1.6;min-height:25px;overflow:hidden}
.it.done textarea{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.it .del{color:var(--ink3);opacity:0;font-size:18px;line-height:1}
.it .del:hover{color:var(--redo)}
.it:hover .del{opacity:1}
.add{color:var(--ink3);font:700 12px/1 "Martian Mono",monospace;padding:8px 0 2px;text-align:left}
.add:hover{color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:14px}
.s{width:92px;text-align:center;font-size:12px;color:var(--ink2)}
.s label{display:block;width:92px;height:64px;border-radius:10px 14px 9px 12px;cursor:pointer;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--sh);position:relative}
.s:nth-child(odd) label{transform:rotate(-2deg)} .s:nth-child(even) label{transform:rotate(1.5deg)}
.s input[type=color]{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.s input.n{width:100%;border:0;background:none;text-align:center;outline:none;font:700 11px/1 "Martian Mono",monospace;margin-top:8px;color:var(--ink2)}
.s .rm{font-size:11px;color:var(--ink3)}
.addc{width:92px;height:64px;border-radius:10px 14px 9px 12px;border:3px dashed var(--edge);color:var(--ink2);font:900 22px/1 Unbounded}
.addc:hover{background:var(--card);color:var(--accent)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.gc{background:var(--card);border:3px solid var(--edge);border-radius:14px 18px 12px 20px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s}
.gc:nth-child(3n+1){transform:rotate(-1deg)} .gc:nth-child(3n+2){transform:rotate(.8deg)} .gc:nth-child(3n){transform:rotate(-.4deg)}
.gc:hover{transform:translate(-2px,-3px) rotate(-1.5deg);box-shadow:8px 8px 0 var(--sh)}
.gc:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--sh)}
.gc .n{font:900 17px/1.2 Unbounded,sans-serif;margin:8px 0 4px}
.gc .d{color:var(--ink2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.gc .m{display:flex;gap:10px;margin-top:10px;font:700 11px/1.3 "Martian Mono",monospace;color:var(--ink3)}
.pill{padding:3px 9px 2px;border-radius:6px 8px 5px 7px;color:#1B2350;font:700 11px/1.4 "Martian Mono",monospace;border:2px solid var(--edge);display:inline-block;transform:rotate(-2deg)}
.newg{border:3px dashed var(--edge);box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--ink2);font:900 15px/1.3 Unbounded;min-height:130px;text-align:center}
.newg:hover{background:var(--card);box-shadow:var(--shadow)}
.danger{color:var(--redo);font:700 12px/1 "Martian Mono",monospace;margin-top:30px}
.banner{background:var(--accent2);border:3px solid var(--edge);border-radius:12px 16px 11px 14px;box-shadow:4px 4px 0 var(--sh);padding:10px 14px;font-size:14px;margin-bottom:24px;transform:rotate(-.4deg)}
.banner a{color:var(--accent);font-weight:700;cursor:pointer}
.menu{position:fixed;z-index:30;background:var(--card);border:3px solid var(--edge);border-radius:12px 16px 11px 14px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.menu button{font-size:22px;padding:4px;border-radius:8px}
.menu button:hover{background:var(--sun)}
.modal{position:fixed;inset:0;background:rgba(27,35,80,.35);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);border:3px solid var(--edge);border-radius:16px 22px 14px 20px;padding:28px;width:430px;max-width:100%;box-shadow:7px 7px 0 var(--sh);transform:rotate(-1deg)}
.modal h3{margin:0 0 8px;font:900 22px/1.15 Unbounded,sans-serif}
.modal p{color:var(--ink2);margin:0 0 14px;font-size:14px}
.modal input{width:100%;border:2.5px solid var(--edge);border-radius:9px 12px 8px 11px;padding:10px 12px;background:var(--bg);outline:none;font:700 13px/1.3 "Martian Mono",monospace}
.modal input:focus{box-shadow:3px 3px 0 var(--accent)}
.btn{background:var(--sun);color:#1B2350;font:900 15px/1 Unbounded,sans-serif;padding:12px 20px 10px;border:3px solid var(--edge);border-radius:11px 15px 10px 13px;box-shadow:4px 4px 0 var(--sh);margin-top:16px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--sun);color:#1B2350;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--sh);padding:9px 16px;border-radius:10px 13px 9px 12px;font:700 12px/1.3 "Martian Mono",monospace;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.burger{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;z-index:35;width:270px;margin:12px;height:calc(100vh - 24px);transform:translateX(-110%);transition:.2s}nav.open{transform:none}
  .burger{display:block;position:fixed;top:12px;left:12px;z-index:34;width:44px;height:44px;border-radius:10px 13px 9px 12px;background:var(--sun);color:#1B2350;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--sh);font-weight:900}
  main{padding:72px 16px 100px}.grid{grid-template-columns:1fr}.grid>.card{transform:none!important}.title{font-size:26px}}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:2.5px dashed var(--line)}
.bt{flex:1;min-width:0;border:0;background:none;outline:none;font:700 15px/1.3 Unbounded,sans-serif;padding:0;color:var(--ink)}
.bt::placeholder{color:var(--ink3)}
.cnt{font:700 11px/1 "Martian Mono",monospace;color:var(--ink3)}
.bc{display:flex;gap:3px;opacity:0;transition:opacity .12s}
.card:hover .bc,.card:focus-within .bc{opacity:1}
.bc button{width:27px;height:27px;border-radius:6px 8px 5px 7px;color:var(--ink2);font-size:14px;border:2px solid transparent}
.bc button:hover{border-color:var(--edge);background:var(--sun);color:#1B2350}
.bc button:disabled{opacity:.3;cursor:default}
.addbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px;color:var(--ink3);font:700 11px/1 "Martian Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.addbar button{padding:9px 14px 8px;border-radius:9px 12px 8px 11px;border:2.5px dashed var(--edge);color:var(--ink);font:700 14px/1 Rubik;text-transform:none;letter-spacing:0}
.addbar button:hover{border-style:solid;background:var(--card);box-shadow:3px 3px 0 var(--sh);transform:rotate(-1deg)}
.empty{color:var(--ink3);text-align:center}
@media (max-width:820px){.bc{opacity:1}}
</style>
</head>
<body>
<button class="burger" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
<div class="app"><nav id="nav"></nav><main><div class="page" id="page"></div></main></div>
<div class="toast" id="toast"></div>
<script>
/* ===== storage: private GitHub repo, key in the link (#k=...) or localStorage ===== */
const CFG = { repo: "Besquait/catsland-gdd", branch: "main", path: "data/gdd.json" };
const H = new URLSearchParams(location.hash.slice(1));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const LSset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
if (H.get("k")) { LSset("cl_key", H.get("k")); history.replaceState(null, "", location.pathname); }
const KEY = H.get("k") || LS("cl_key");
const REMOTE = !!KEY;
const api = (p, o = {}) => fetch("https://api.github.com/repos/" + CFG.repo + p, { ...o, cache: "no-store",
  headers: { Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json" } });
const enc = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 32768) r += String.fromCharCode(...b.subarray(i, i + 32768)); return btoa(r); };
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);

let doc, base, sha = null, dirty = false, saving = false, timer = null, what = new Set();

function B(kind, title, extra) {
  const b = { id: uid(), kind, title, wide: false, text: "", items: [], colors: [] };
  return Object.assign(b, extra || {});
}
function introBlocks() {
  return [B("text", "Идея в двух предложениях", { wide: true, ph: "Cats Land — это…" }), B("text", "Для кого", { ph: "Кто играет и почему" }),
    B("text", "Платформа и формат", { ph: "Где играют, сколько игроков" }), B("text", "Как устроена сессия", { wide: true, ph: "Зашёл → выбрал мини-игру → …" }),
    B("text", "Общие правила для всех мини-игр", { wide: true, ph: "Очки, награды, раунды" })];
}
function styleBlocks() {
  return [B("palette", "Палитра", { wide: true, colors: [{ id: uid(), c: "#F08A4B", n: "Акцент" }, { id: uid(), c: "#FFF6EC", n: "Фон" }, { id: uid(), c: "#2A2622", n: "Текст" }] }),
    B("text", "Визуальный стиль", { ph: "Мультяшно, мягкие формы, …" }), B("text", "Интерфейс", { ph: "Кнопки, окна, иконки" }),
    B("text", "Шрифты и текст"), B("text", "Звук и музыка"), B("list", "Референсы", { ph: "Ссылка или описание" })];
}
function gameBlocks() {
  return [B("text", "Суть", { wide: true, ph: "Игроки … и побеждает тот, кто …" }), B("text", "Как работает", { wide: true, ph: "1. …" }),
    B("text", "Управление", { ph: "Какие кнопки и что делают" }), B("text", "Победа и поражение", { ph: "Когда раунд заканчивается" }),
    B("list", "Доделать", { ph: "Что нужно сделать" }), B("list", "Переделать", { ph: "Сейчас … → должно быть …" })];
}
function seed() { return { intro: { blocks: introBlocks() }, style: { blocks: styleBlocks() }, games: [] }; }
function newGame() { return { id: uid(), emoji: "🐱", name: "Новая мини-игра", status: "idea", blocks: gameBlocks() }; }

/* older documents had fixed fields: turn them into blocks once */
function migrate(d) {
  if (!d || typeof d !== "object") return seed();
  const t = (b, v) => Object.assign(b, { text: v || "" });
  const lst = (b, v) => Object.assign(b, { items: (v || []).map(x => ({ id: x.id || uid(), t: x.t || "", done: !!x.done })) });
  if (d.intro && !d.intro.blocks) {
    const o = d.intro, bl = introBlocks();
    [o.pitch, o.audience, o.platform, o.loop, o.session].forEach((v, i) => t(bl[i], v));
    d.intro = { blocks: bl };
  }
  if (d.style && !d.style.blocks) {
    const o = d.style, bl = styleBlocks();
    if (o.palette) bl[0].colors = o.palette;
    [o.visual, o.ui, o.fonts, o.sound].forEach((v, i) => t(bl[i + 1], v));
    lst(bl[5], o.refs);
    d.style = { blocks: bl };
  }
  d.intro = d.intro || { blocks: introBlocks() };
  d.style = d.style || { blocks: styleBlocks() };
  d.games = (d.games || []).map(g => {
    if (g.blocks) return g;
    const bl = gameBlocks();
    [g.summary, g.rules, g.controls, g.win].forEach((v, i) => t(bl[i], v));
    lst(bl[4], g.todo); lst(bl[5], g.redo);
    (g.extra || []).forEach(x => bl.push(B("text", x.h || "", { text: x.t || "", wide: true })));
    return { id: g.id, emoji: g.emoji || "🐱", name: g.name || "Мини-игра", status: g.status || "idea", blocks: bl };
  });
  return d;
}

/* three-way merge: arrays of {id} merge per item, other values: local wins if it changed */
function merge(b, l, r) {
  if (Array.isArray(l) && Array.isArray(r) && l.concat(r).every(x => x && typeof x === "object" && "id" in x)) {
    const B = new Map((b || []).map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
    const out = [];
    for (const id of new Set([...l.map(x => x.id), ...r.map(x => x.id)])) {
      if (B.has(id) && (!L.has(id) || !R.has(id))) continue;
      out.push(B.has(id) ? merge(B.get(id), L.get(id), R.get(id)) : (L.get(id) || R.get(id)));
    }
    return out;
  }
  if (l && r && typeof l === "object" && typeof r === "object" && !Array.isArray(l)) {
    const o = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) o[k] = merge(b && b[k], l[k], r[k]);
    return o;
  }
  return JSON.stringify(l) !== JSON.stringify(b) ? l : r;
}

async function load() {
  if (!REMOTE) { const s = LS("cl_doc2"); doc = s ? JSON.parse(s) : seed(); base = clone(doc); return; }
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
  if (r.status === 404) { doc = seed(); base = seed(); save("старт"); return; }
  if (!r.ok) throw new Error(r.status === 401 ? "ключ не подходит" : "GitHub " + r.status);
  const j = await r.json(); sha = j.sha; doc = JSON.parse(dec(j.content)); base = clone(doc);
  if (!doc.games) { doc = seed(); save("новая структура"); }
}
function save(msg) {
  if (msg) what.add(msg);
  if (!REMOTE) { LSset("cl_doc2", JSON.stringify(doc)); sync("", "Сохранено в этом браузере"); return; }
  dirty = true; sync("busy", "Сохраняю…"); clearTimeout(timer); timer = setTimeout(push, 1200);
}
async function push() {
  if (saving) { timer = setTimeout(push, 700); return; }
  saving = true;
  try {
    for (let i = 0; i < 4; i++) {
      const snap = clone(doc);
      const body = { message: me() + ": " + ([...what].slice(0, 3).join(", ") || "правки"), content: enc(JSON.stringify(snap, null, 1)), branch: CFG.branch };
      if (sha) body.sha = sha;
      const r = await api("/contents/" + CFG.path, { method: "PUT", body: JSON.stringify(body) });
      if (r.ok) { sha = (await r.json()).content.sha; base = snap; what.clear(); dirty = JSON.stringify(doc) !== JSON.stringify(snap); sync("", "Сохранено"); if (dirty) timer = setTimeout(push, 500); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("GitHub " + r.status);
      const g = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); const j = await g.json();
      const remote = JSON.parse(dec(j.content)); doc = merge(base, doc, remote); base = remote; sha = j.sha;
      if (!typing()) render();
    }
  } catch (e) { sync("err", "Не сохранено: " + e.message); timer = setTimeout(push, 8000); }
  finally { saving = false; }
}
async function pull() {
  if (!REMOTE || dirty || saving || typing()) return;
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch); if (!r.ok) return;
  const j = await r.json(); if (j.sha === sha) return;
  sha = j.sha; doc = JSON.parse(dec(j.content)); base = clone(doc); render();
}
const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"); };

/* ===== ui helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function sync(cls, t) { const el = $("#syncT"); if (!el) return; el.textContent = t; $("#syncI").className = cls; }

const STATUS = { idea: ["Идея", "var(--idea)"], work: ["В работе", "var(--work)"], done: ["Готово", "var(--done)"], redo: ["Переделать", "var(--redo)"] };
let view = "intro";

  if (b.kind === "list") body = `<div class="cl">${b.items.map(x => `<div class="it${x.done ? " done" : ""}"><input type="checkbox" data-chk="${p}.items|${x.id}" ${x.done ? "checked" : ""}>
      <textarea rows="1" data-item="${p}.items|${x.id}" placeholder="${esc(b.ph || "Пункт")}">${esc(x.t)}</textarea><button class="del" data-del="${p}.items|${x.id}">×</button></div>`).join("")}</div>

function blocksHTML() {
  const bp = blocksPath(), list = get(bp);
  return `<div class="grid">${list.map((b, i) => blockHTML(bp, b, i, list.length)).join("") || `<div class="card wide empty">Блоков нет — добавьте первый ниже</div>`}</div>
    <div class="addbar"><span>Добавить блок:</span><button data-addb="text">＋ Текст</button><button data-addb="list">＋ Чеклист</button><button data-addb="palette">＋ Палитра</button></div>`;
}

function renderNav() {
  const g = doc.games;
  $("#nav").innerHTML = `<div class="logo">Cats <span>Land</span></div>
    <div class="nl ${view === "intro" ? "on" : ""}" data-go="intro">📖 <span class="t">Введение</span></div>
    <div class="nl ${view === "style" ? "on" : ""}" data-go="style">🎨 <span class="t">Общие стили</span></div>
    <div class="lbl">Мини-игры <button data-newgame title="Добавить">+</button></div>
    <div class="nl ${view === "games" ? "on" : ""}" data-go="games">🗂️ <span class="t">Все мини-игры</span><span class="c">${g.length}</span></div>
    ${g.map(x => `<div class="nl ${view === x.id ? "on" : ""}" data-go="${x.id}"><span class="dot" style="background:${STATUS[x.status][1]}"></span><span class="t">${esc(x.emoji)} ${esc(x.name)}</span>${openCount(x) ? `<span class="c">${openCount(x)}</span>` : ""}</div>`).join("")}
    <div class="foot"><div class="sync"><i id="syncI"></i><span id="syncT">${REMOTE ? "Сохранено" : "Только этот браузер"}</span></div>
      <div>Вы: <a onclick="askName(true)">${esc(me())}</a></div>
      ${REMOTE ? `<a onclick="share()">Скопировать ссылку для своих</a>` : `<a onclick="askKey()">Подключить общий диз-док</a>`}</div>`;
}

function render() {
  if (!["intro", "style", "games"].includes(view) && !curGame()) view = "games";
  renderNav();
  const P = $("#page");
  const banner = REMOTE ? "" : `<div class="banner">Сейчас правки сохраняются только в этом браузере. <a onclick="askKey()">Подключить общий диз-док</a></div>`;
  if (view === "intro") {
    P.innerHTML = banner + `<div class="head"><span class="emoji">📖</span><div class="title">Введение</div></div><p class="sub">Что за игра — коротко, чтобы новый человек понял за минуту</p>` + blocksHTML();
  } else if (view === "style") {
    P.innerHTML = banner + `<div class="head"><span class="emoji">🎨</span><div class="title">Общие стили</div></div><p class="sub">Как всё выглядит и звучит во всех мини-играх</p>` + blocksHTML();
  } else if (view === "games") {
    P.innerHTML = banner + `<div class="head"><span class="emoji">🗂️</span><div class="title">Мини-игры</div></div><p class="sub">${doc.games.length} шт.</p>
      <div class="games">${doc.games.map(g => { const first = g.blocks.find(b => b.kind === "text" && b.text);
        return `<button class="gc" data-go="${g.id}"><span class="pill" style="background:${STATUS[g.status][1]}">${STATUS[g.status][0]}</span><div class="n">${esc(g.emoji)} ${esc(g.name)}</div>
        <div class="d">${first ? esc(first.text) : "<span style='color:var(--ink3)'>Пока пусто</span>"}</div><div class="m"><span>открытых пунктов: ${openCount(g)}</span></div></button>`; }).join("")}
      <button class="gc newg" data-newgame>+ Мини-игра</button></div>`;
  } else {
    const g = curGame();
    P.innerHTML = banner + `<div class="head"><span class="emoji" data-emoji>${esc(g.emoji)}</span><input class="title" data-p="games.${g.id}.name" value="${esc(g.name)}"></div>
      <div class="status">${Object.entries(STATUS).map(([k, [t, c]]) => `<button class="${g.status === k ? "on" : ""}" style="${g.status === k ? "background:" + c : ""}" data-status="${k}">${t}</button>`).join("")}</div>`
      + blocksHTML() + `<button class="danger" data-delgame>Удалить мини-игру</button>`;

}
function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

/* ===== events ===== */
const pair = s => { const [p, id] = s.split("|"); return [get(p), id, p]; };
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (t.tagName === "TEXTAREA") grow(t);
  if (d.p) { setv(d.p, t.value); if (d.p.endsWith(".name")) renderNav(); }
  else if (d.item) { const [l, id] = pair(d.item); l.find(x => x.id === id).t = t.value; }
  else if (d.col) { const [l, id] = pair(d.col); l.find(x => x.id === id).c = t.value; t.parentElement.style.background = t.value; }
  else if (d.coln) { const [l, id] = pair(d.coln); l.find(x => x.id === id).n = t.value; }
  else return;
  save(label());
});
document.addEventListener("keydown", e => {
  const d = e.target.dataset || {};
  if (d.item && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const [, id, p] = pair(d.item); addItem(p, id); }
  if (d.item && e.key === "Backspace" && !e.target.value) {
    e.preventDefault(); const [l, id, p] = pair(d.item); const i = l.findIndex(x => x.id === id);
    l.splice(i, 1); save(label()); render(); const prev = l[Math.max(0, i - 1)]; if (prev) focusItem(p, prev.id);
  }
});
function addItem(p, after) { const l = get(p); const it = { id: uid(), t: "", done: false }; const i = after ? l.findIndex(x => x.id === after) + 1 : l.length; l.splice(i, 0, it); save(label()); render(); focusItem(p, it.id); }
function focusItem(p, id) { const el = document.querySelector(`[data-item="${p}|${id}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
const NEWB = { text: ["Новый раздел", {}], list: ["Список", {}], palette: ["Цвета", { colors: [{ id: uid(), c: "#F08A4B", n: "Цвет" }] }] };
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-newgame],[data-status],[data-chk],[data-del],[data-addi],[data-coladd],[data-colrm],[data-addb],[data-rmb],[data-mv],[data-wide],[data-delgame],[data-emoji]");
  if (!t || t.disabled) return; const d = t.dataset;
  if (d.go) { view = d.go; $("nav").classList.remove("open"); render(); scrollTo(0, 0); return; }
  if ("newgame" in d) { const g = newGame(); doc.games.push(g); view = g.id; save("новая мини-игра"); render(); const n = $(".title"); n.focus(); n.select(); return; }
  if (d.status) { curGame().status = d.status; save(label() + ": статус"); render(); return; }
  if (d.chk) { const [l, id] = pair(d.chk); l.find(i => i.id === id).done = t.checked; save(label()); render(); return; }
  if (d.del) { const [l, id] = pair(d.del); l.splice(l.findIndex(x => x.id === id), 1); save(label()); render(); return; }
  if (d.addi) { addItem(d.addi); return; }
  if (d.coladd) { get(d.coladd).push({ id: uid(), c: "#CCCCCC", n: "Цвет" }); save(label()); render(); return; }
  if (d.colrm) { const [l, id] = pair(d.colrm); l.splice(l.findIndex(x => x.id === id), 1); save(label()); render(); return; }
  const bl = get(blocksPath());
  if (d.addb) {
    const [title, extra] = NEWB[d.addb]; const b = B(d.addb, title, JSON.parse(JSON.stringify(extra)));
    if (d.addb === "palette") b.colors.forEach(c => c.id = uid());
    bl.push(b); save(label() + ": новый блок"); render();
    const el = document.querySelector(`[data-block="${b.id}"] .bt`); if (el) { el.focus(); el.select(); el.scrollIntoView({ block: "center" }); }
    return;
  }
  if (d.rmb) {
    const i = bl.findIndex(x => x.id === d.rmb), b = bl[i];
    const has = b.text || b.items.length || (b.kind === "palette" && b.colors.length);
    if (has && !confirm("Удалить блок «" + (b.title || "без названия") + "» вместе с содержимым?")) return;
    bl.splice(i, 1); save(label() + ": блок удалён"); render(); return;
  }
  if (d.mv) { const [id, dir] = d.mv.split("|"); const i = bl.findIndex(x => x.id === id), j = i + +dir; if (j < 0 || j >= bl.length) return; bl.splice(j, 0, bl.splice(i, 1)[0]); save(label()); render(); return; }

  if ("emoji" in d) pickEmoji(t);
});
const EM = [..."🐱🐈😺😸😼🙀🐾🧶🐟🥛🐭🦴🏃🧩🎯🎲🏆⚽🎈🎁🍰🌈⭐🔥💧🌙🌳🍄🪁🎵🚀🧊"];
function pickEmoji(el) {
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = EM.map(x => `<button>${x}</button>`).join("");
  const r = el.getBoundingClientRect(); m.style.left = r.left + "px"; m.style.top = r.bottom + 6 + "px";
  m.onclick = e => { const b = e.target.closest("button"); if (!b) return; curGame().emoji = b.textContent; m.remove(); save(label()); render(); };
  document.body.appendChild(m);
  setTimeout(() => document.addEventListener("click", function h(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener("click", h); } }), 0);
}
function modal(html, ok) {
  const w = document.createElement("div"); w.className = "modal"; w.innerHTML = `<div>${html}</div>`; document.body.appendChild(w);
  const i = w.querySelector("input"); setTimeout(() => i && i.focus(), 20);
  const go = () => { if (ok(i && i.value.trim()) !== false) w.remove(); };
  w.querySelector(".btn").onclick = go; if (i) i.onkeydown = e => { if (e.key === "Enter") go(); };
  w.onclick = e => { if (e.target === w) w.remove(); };
}
function askName(force) {
  if (!force && LS("cl_name")) return;
  modal(`<h3>Как вас подписывать?</h3><p>Имя попадёт в историю правок.</p><input value="${esc(LS("cl_name") || "")}" placeholder="Имя"><button class="btn">Готово</button>`,
    v => { if (!v) return false; LSset("cl_name", v); renderNav(); });
}
function askKey() {
  const url = "https://github.com/settings/personal-access-tokens/new?name=catsland&target_name=Besquait&expires_in=none&contents=write";
  modal(`<h3>Общий диз-док</h3><p>Если вам прислали ссылку — просто откройте её.<br><br>Владелец подключает один раз: <a href="${url}" target="_blank">создать ключ</a> → Only select repositories: <b>catsland-gdd</b> → Generate → вставить сюда.</p><input placeholder="Ключ"><button class="btn">Подключить</button>`,
    v => { if (!v) return false; LSset("cl_key", v); location.reload(); });
}
function share() { const u = location.origin + location.pathname + "#k=" + KEY; navigator.clipboard.writeText(u).then(() => toast("Ссылка скопирована"), () => prompt("Ссылка", u)); }
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  try { await load(); } catch (e) { doc = seed(); base = clone(doc); setTimeout(() => sync("err", "Нет доступа: " + e.message), 0); }
  const before = JSON.stringify(doc);
  doc = migrate(doc);
  if (JSON.stringify(doc) !== before) save("переход на блоки");
  render(); askName(false);
  if (REMOTE) setInterval(pull, 20000);
})();
