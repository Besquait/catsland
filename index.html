<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cats Land — диз-док</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7; --panel:#F4F1EB; --card:#FFFFFF; --ink:#23201C; --ink2:#6B645B; --ink3:#A39B90;
  --line:#E9E4DB; --accent:#E07A3F; --accent-soft:#FBEBDF; --ok:#4F9D6B; --ok-soft:#E3F2E8;
  --hover:#F1EDE6; --shadow:0 12px 40px rgba(60,40,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1A18; --panel:#211F1C; --card:#262420; --ink:#EEE9E1; --ink2:#AFA79B; --ink3:#77705F;
  --line:#34312C; --accent:#F0935A; --accent-soft:#3A2A20; --ok:#6FBF8A; --ok-soft:#1F3326; --hover:#2B2824; --shadow:0 12px 40px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.7 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:28px 16px 20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:600 20px/1.2 Fraunces,serif}
.brand .paw{font-size:22px}
.search{margin:0 4px 14px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--accent)}
.search span{position:absolute;left:12px;top:9px;color:var(--ink3)}
.nav-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:9px;color:var(--ink2);text-decoration:none;cursor:pointer;font-size:15px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.nav a .em{width:22px;text-align:center}
.nav a .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.add-sec{margin:6px 4px;padding:8px 12px;border-radius:9px;color:var(--ink3);text-align:left}
.add-sec:hover{background:var(--hover);color:var(--ink)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);display:flex;flex-direction:column;gap:6px}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
.dot.err{background:#D9534F}
@keyframes pulse{50%{opacity:.35}}
.linkish{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* main */
.main{padding:96px 48px 200px;overflow-x:hidden}
.page{max-width:760px;margin:0 auto}
.crumb{color:var(--ink3);font-size:14px;margin-bottom:18px;display:flex;gap:10px;align-items:center}
.page-emoji{font-size:52px;line-height:1;margin-bottom:14px;cursor:pointer;display:inline-block;border-radius:12px;padding:4px}
.page-emoji:hover{background:var(--hover)}
h1.title{font:600 44px/1.15 Fraunces,serif;margin:0 0 10px;outline:none;letter-spacing:-.01em}
.subtitle{color:var(--ink2);margin:0 0 48px;outline:none;font-size:18px}
[contenteditable]:empty:before{content:attr(data-ph);color:var(--ink3)}
.blocks{display:flex;flex-direction:column;gap:2px}
.blk{position:relative;display:flex;align-items:flex-start;border-radius:10px;padding:3px 0}
.blk:hover{background:linear-gradient(90deg,transparent,var(--hover) 8%,var(--hover) 92%,transparent)}
.blk .gut{position:absolute;left:-58px;top:4px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.blk:hover .gut,.blk.focus .gut{opacity:1}
.gut button{width:26px;height:26px;border-radius:7px;color:var(--ink3);font-size:15px;line-height:26px}
.gut button:hover{background:var(--line);color:var(--ink)}
.blk .body{flex:1;min-width:0;outline:none;padding:2px 6px;white-space:pre-wrap;word-wrap:break-word}
.blk .nt{margin-left:10px;margin-top:3px;flex:none;display:flex;align-items:center;gap:5px;font-size:13px;padding:2px 9px;border-radius:14px;color:var(--ink3);opacity:0;transition:opacity .12s}
.blk:hover .nt{opacity:1}
.blk .nt.has{opacity:1;background:var(--accent-soft);color:var(--accent);font-weight:600}
.blk .nt.done{opacity:1;background:var(--ok-soft);color:var(--ok)}
.blk .nt:hover{background:var(--accent-soft);color:var(--accent)}
.blk.h2 .body{font:600 28px/1.3 Fraunces,serif;margin-top:36px}
.blk.h3 .body{font-weight:600;font-size:19px;margin-top:22px}
.blk.li .body{padding-left:28px;position:relative}
.blk.li .body:before{content:"";position:absolute;left:12px;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.blk.todo .chk{margin:7px 0 0 8px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink3);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.blk.todo.checked .chk{background:var(--ok);border-color:var(--ok)}
.blk.todo.checked .body{color:var(--ink3);text-decoration:line-through}
.blk.rule{margin:14px 0}
.blk.rule .body{background:var(--accent-soft);border-radius:12px;padding:16px 18px 16px 50px;position:relative}
.blk.rule .body:before{content:"🐾";position:absolute;left:18px;top:15px}
.blk.q .body{border-left:3px solid var(--line);padding-left:18px;color:var(--ink2);font-style:italic}
.blk.hr .body{height:1px;background:var(--line);margin:22px 6px;padding:0}
.add-line{margin-top:18px;color:var(--ink3);padding:8px 6px;border-radius:9px;text-align:left;width:100%}
.add-line:hover{background:var(--hover);color:var(--ink)}
/* menus */
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px}
.menu button:hover,.menu button.act{background:var(--hover)}
.menu .ic{width:22px;text-align:center;color:var(--ink2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .danger{color:#C0463F}
/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100vw;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s ease;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{padding:26px 28px 14px;display:flex;align-items:flex-start;gap:12px}
.dr-head h3{margin:0;font:600 20px/1.3 Fraunces,serif;flex:1}
.dr-quote{margin:0 28px 10px;padding:12px 14px;border-radius:10px;background:var(--panel);color:var(--ink2);font-size:14px;max-height:120px;overflow:auto;white-space:pre-wrap}
.dr-list{flex:1;overflow:auto;padding:8px 28px 20px;display:flex;flex-direction:column;gap:14px}
.note{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note.resolved{opacity:.6}
.note .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);margin-bottom:6px}
.note .who{color:var(--ink);font-weight:600}
.note .txt{white-space:pre-wrap}
.note .acts{display:flex;gap:12px;margin-top:8px;font-size:13px}
.note .acts button{color:var(--ink3)}
.note .acts button:hover{color:var(--ink)}
.dr-new{padding:16px 28px 26px;border-top:1px solid var(--line)}
.dr-new textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);outline:none;resize:vertical}
.dr-new textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.btn{padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}
.x{width:32px;height:32px;border-radius:9px;color:var(--ink3);font-size:20px}
.x:hover{background:var(--hover);color:var(--ink)}
/* lists pages */
.card-list{display:flex;flex-direction:column;gap:14px}
.ncard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card);cursor:pointer}
.ncard:hover{border-color:var(--ink3)}
.ncard .where{font-size:13px;color:var(--ink3);margin-bottom:4px}
.tabs{display:flex;gap:6px;margin:-24px 0 30px}
.tabs button{padding:6px 14px;border-radius:20px;color:var(--ink2);font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.empty{color:var(--ink3);padding:40px 0;text-align:center}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:40px;font-size:14px;display:flex;gap:12px;align-items:center}
.banner b{color:var(--accent)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.28);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;padding:34px 34px 28px;width:440px;max-width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font:600 24px/1.3 Fraunces,serif}
.modal p{color:var(--ink2);margin:0 0 18px;font-size:15px}
.modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--bg);outline:none}
.modal input:focus{border-color:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.hist .d{color:var(--ink3);font-size:14px;width:130px;flex:none}
.burger{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:45;left:0;top:0;width:280px;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:block;position:fixed;top:14px;left:14px;z-index:44;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
  .main{padding:72px 16px 160px}
  .blk .gut{left:-4px;top:-26px}
  h1.title{font-size:34px}
  .blk .nt{opacity:1}
}
</style>
</head>
<body>
<button class="burger" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="paw">🐾</span> Cats Land</div>
    <div class="search"><span>⌕</span><input id="q" placeholder="Поиск по диз-доку" autocomplete="off"></div>
    <div class="nav" id="navTop"></div>
    <div class="nav-label">Разделы</div>
    <div class="nav" id="nav"></div>
    <button class="add-sec" onclick="addSection()">+ Новый раздел</button>
    <div class="side-foot">
      <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Сохранено</span></div>
      <div>Вы: <span class="linkish" id="me" onclick="askName(true)"></span></div>
    </div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const CFG = { repo: "OWNER/catsland-gdd", branch: "main", path: "data/gdd.json" };
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("k")) { try { localStorage.setItem("cl_key", hash.get("k")); } catch (e) {} }
if (hash.get("r")) { try { localStorage.setItem("cl_repo", hash.get("r")); } catch (e) {} }
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const LSset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const KEY = hash.get("k") || LS("cl_key");
const REPO = hash.get("r") || LS("cl_repo") || CFG.repo;
const REMOTE = !!KEY && !REPO.startsWith("OWNER/");
if (hash.get("k")) history.replaceState(null, "", location.pathname + location.search);

const api = (p, o = {}) => fetch("https://api.github.com/repos/" + REPO + p, {
  ...o, cache: "no-store",
  headers: { Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json", ...(o.headers || {}) }
});
const b64enc = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(r); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

let doc, base, sha = null, dirty = false, saving = false, saveTimer = null, lastMsg = new Set();

async function load() {
  if (!REMOTE) {
    const s = LS("cl_doc");
    doc = s ? JSON.parse(s) : seed();
    base = clone(doc);
    return;
  }
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
  if (r.status === 404) { doc = seed(); base = { sections: [] }; sha = null; dirty = true; scheduleSave("Создан диз-док"); return; }
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  sha = j.sha; doc = JSON.parse(b64dec(j.content)); base = clone(doc);
}

async function pull() {
  if (!REMOTE || dirty || saving) return;
  const r = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
  if (!r.ok) return;
  const j = await r.json();
  if (j.sha === sha) return;
  sha = j.sha; const remote = JSON.parse(b64dec(j.content));
  doc = remote; base = clone(remote);
  if (!document.activeElement || !document.activeElement.isContentEditable) render(); else pendingRender = true;
}
let pendingRender = false;

function scheduleSave(msg) {
  dirty = true; if (msg) lastMsg.add(msg);
  setSync("busy", "Сохраняю…");
  if (!REMOTE) { LSset("cl_doc", JSON.stringify(doc)); dirty = false; base = clone(doc); lastMsg.clear(); setTimeout(() => setSync("ok", "Сохранено в браузере"), 250); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1400);
}

async function save() {
  if (saving) { saveTimer = setTimeout(save, 800); return; }
  saving = true;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const snapshot = clone(doc);
      const msg = me() + ": " + ([...lastMsg].slice(0, 3).join(", ") || "правки");
      const body = { message: msg, content: b64enc(JSON.stringify(snapshot, null, 1)), branch: CFG.branch };
      if (sha) body.sha = sha;
      const r = await api("/contents/" + CFG.path, { method: "PUT", body: JSON.stringify(body) });
      if (r.ok) {
        sha = (await r.json()).content.sha; base = snapshot; lastMsg.clear();
        dirty = JSON.stringify(doc) !== JSON.stringify(snapshot);
        setSync("ok", "Сохранено"); if (dirty) saveTimer = setTimeout(save, 600);
        return;
      }
      if (r.status === 409 || r.status === 422) {
        const g = await api("/contents/" + CFG.path + "?ref=" + CFG.branch);
        if (!g.ok) throw new Error("GitHub " + g.status);
        const j = await g.json(); const remote = JSON.parse(b64dec(j.content));
        doc = mergeDoc(base, doc, remote); base = remote; sha = j.sha;
        const act = document.activeElement; if (!act || !act.isContentEditable) render();
        continue;
      }
      throw new Error("GitHub " + r.status);
    }
  } catch (e) { setSync("err", "Не сохранено — " + e.message); saveTimer = setTimeout(save, 8000); }
  finally { saving = false; }
}

/* three-way merge by id: local changes win where they differ from base */
function mergeList(b = [], l = [], r = [], mergeItem) {
  const B = new Map(b.map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
  const localOrderChanged = JSON.stringify(l.map(x => x.id).filter(id => B.has(id))) !== JSON.stringify(b.map(x => x.id).filter(id => L.has(id)));
  let out = (localOrderChanged ? l : r).filter(x => R.has(x.id) || !B.has(x.id)).filter(x => L.has(x.id) || !B.has(x.id));
  out = out.map(x => (B.has(x.id) && L.has(x.id) && R.has(x.id)) ? mergeItem(B.get(x.id), L.get(x.id), R.get(x.id)) : (L.get(x.id) || R.get(x.id)));
  const ids = new Set(out.map(x => x.id));
  const pools = [[l, L], [r, R]];
  for (const [arr] of pools) arr.forEach((x, i) => {
    if (ids.has(x.id) || B.has(x.id)) return;
    const prev = arr[i - 1]; const at = prev ? out.findIndex(y => y.id === prev.id) + 1 : 0;
    out.splice(at, 0, x); ids.add(x.id);
  });
  return out;
}
function mergeFields(b, l, r, skip) {
  const o = { ...r };
  for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {
    if (skip.includes(k)) continue;
    if (JSON.stringify(l[k]) !== JSON.stringify(b[k])) o[k] = l[k];
  }
  return o;
}
const mergeNote = (b, l, r) => mergeFields(b, l, r, []);
const mergeBlock = (b, l, r) => ({ ...mergeFields(b, l, r, ["notes"]), notes: mergeList(b.notes, l.notes, r.notes, mergeNote) });
const mergeSection = (b, l, r) => ({ ...mergeFields(b, l, r, ["blocks"]), blocks: mergeList(b.blocks, l.blocks, r.blocks, mergeBlock) });
const mergeDoc = (b, l, r) => ({ ...mergeFields(b, l, r, ["sections"]), sections: mergeList(b.sections, l.sections, r.sections, mergeSection) });

/* ---------- helpers ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const me = () => LS("cl_name") || "Гость";
const $ = s => document.querySelector(s);
const fmt = ts => { const d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800); }
function setSync(state, txt) { $("#dot").className = "dot" + (state === "busy" ? " busy" : state === "err" ? " err" : ""); $("#syncTxt").textContent = txt; }
const sec = id => doc.sections.find(s => s.id === id);
const openNotes = b => (b.notes || []).filter(n => !n.resolved).length;

/* ---------- seed ---------- */
function B(type, text, extra) { return { id: uid(), type, text, notes: [], ...(extra || {}) }; }
function seed() {
  const S = (emoji, title, subtitle, blocks) => ({ id: uid(), emoji, title, subtitle, blocks });
  return { title: "Cats Land", sections: [
    S("🐱", "Концепция", "О чём игра в одном абзаце", [
      B("p", ""), B("h3", "Жанр и платформа"), B("p", ""), B("h3", "Для кого"), B("p", ""),
      B("h3", "Чем цепляет"), B("li", ""), B("li", ""), B("li", ""),
      B("rule", "Главная эмоция, которую игрок должен унести из сессии: …")]),
    S("🔁", "Игровой цикл", "Что игрок делает минуту за минутой и день за днём", [
      B("h3", "Минута"), B("p", ""), B("h3", "Сессия"), B("p", ""), B("h3", "Долгая цель"), B("p", "")]),
    S("🐾", "Коты", "Персонажи, породы, характеры, анимации", [
      B("h3", "Как выглядит кот игрока"), B("p", ""), B("h3", "Кастомизация"), B("li", ""),
      B("h3", "Способности и движения"), B("todo", "Бег"), B("todo", "Прыжок"), B("todo", "Лазанье"), B("todo", "Мяу / эмоции")]),
    S("🏡", "Мир и локации", "Где живут коты и что там происходит", [
      B("h3", "Хаб"), B("p", ""), B("h3", "Локации"), B("li", ""), B("li", ""), B("h3", "Настроение и свет"), B("p", "")]),
    S("⚙️", "Механики", "Как именно всё работает — с цифрами", [

const PH = { p: "Пишите здесь, «/» — выбрать тип", h2: "Заголовок", h3: "Подзаголовок", li: "Пункт списка", todo: "Задача", rule: "Правило: как это должно работать", q: "Цитата или референс" };

function bindPage(s) {
  const t = $("#secTitle"), sub = $("#secSub");
  t.oninput = () => { s.title = t.textContent; renderNav(); scheduleSave("раздел «" + s.title + "»"); };
  sub.oninput = () => { s.subtitle = sub.textContent; scheduleSave("раздел «" + s.title + "»"); };
  t.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sub.focus(); } };
  sub.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (s.blocks[0]) focusBlock(s.blocks[0].id); else addBlock(null, "p"); } };
  $("#blocks").querySelectorAll(".blk").forEach(el => {
    const id = el.dataset.id, b = s.blocks.find(x => x.id === id), body = el.querySelector(".body");
    body.onfocus = () => el.classList.add("focus");
    body.onblur = () => { el.classList.remove("focus"); if (pendingRender) setTimeout(() => { if (!document.activeElement.isContentEditable) render(); }, 50); };
    body.oninput = () => {
      b.text = body.innerText.replace(/\n$/, "");

function caretAtStart(el) { const s = getSelection(); if (!s.rangeCount) return false; const r = s.getRangeAt(0).cloneRange(); r.selectNodeContents(el); r.setEnd(s.getRangeAt(0).startContainer, s.getRangeAt(0).startOffset); return r.toString().length === 0; }
function keyInBlock(e, s, b, body) {

    const items = [...menuEl.querySelectorAll("button")]; let i = items.findIndex(x => x.classList.contains("act"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items.forEach(x => x.classList.remove("act")); i = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[i].classList.add("act"); return; }

    if ((b.type === "li" || b.type === "todo") && !b.text) { b.type = "p"; scheduleSave(); render(); focusBlock(b.id); return; }
    addBlock(b.id, next);
  } else if (e.key === "Backspace" && caretAtStart(body) && !body.innerText.replace(/\n/g, "")) {
    e.preventDefault();
    if (b.type !== "p") { b.type = "p"; scheduleSave(); render(); focusBlock(b.id); return; }
    const i = s.blocks.indexOf(b); if (s.blocks.length < 2) return;
    s.blocks.splice(i, 1); scheduleSave("«" + s.title + "»"); render();

  } else if (e.key === "ArrowUp" && caretAtStart(body)) {
    const i = s.blocks.indexOf(b); if (i > 0) { e.preventDefault(); focusBlock(s.blocks[i - 1].id, true); }
  } else if (e.key === "ArrowDown") {

}

function addBlock(afterId, type) {

const TYPES = [["p", "¶", "Текст"], ["h2", "H", "Большой заголовок"], ["h3", "h", "Подзаголовок"], ["li", "•", "Список"], ["todo", "☐", "Задача"], ["rule", "🐾", "Правило"], ["q", "❝", "Цитата / референс"], ["hr", "—", "Разделитель"]];

  m.innerHTML = `<button data-a="note"><span class="ic">💬</span>Заметки к этому месту</button><hr>` +
    TYPES.map(([t, ic, name]) => `<button data-t="${t}"><span class="ic">${ic}</span>${name}${b.type === t ? " ✓" : ""}</button>`).join("") +
    `<hr><button data-a="up"><span class="ic">↑</span>Выше</button><button data-a="down"><span class="ic">↓</span>Ниже</button><button data-a="dup"><span class="ic">⧉</span>Дублировать</button><button data-a="link"><span class="ic">🔗</span>Ссылка на место</button><hr><button data-a="del" class="danger"><span class="ic">✕</span>Удалить</button>`;

function findBlock(id) { for (const s of doc.sections) { const b = s.blocks.find(x => x.id === id); if (b) return [s, b]; } return [null, null]; }

function renderSearch(q) {

  if (!force && LS("cl_name")) return;
  modal(`<h3>Как вас подписывать?</h3><p>Имя будет стоять рядом с вашими заметками и правками.</p><input placeholder="Имя" value="${esc(LS("cl_name") || "")}"><div class="row" style="margin-top:18px"><button class="btn">Готово</button></div>`,
    v => { if (!v) return false; LSset("cl_name", v); renderNav(); });
}
function askKey() {
  modal(`<h3>Общий диз-док</h3><p>Откройте ссылку доступа, которую вам прислали, или вставьте ключ.</p><input placeholder="Ключ доступа"><div class="row" style="margin-top:18px"><button class="btn">Подключить</button><button class="btn ghost">Отмена</button></div>`,
    v => { if (!v) return false; LSset("cl_key", v); location.reload(); });
}

/* ---------- boot ---------- */
$("#q").oninput = () => render();
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") { if (menuEl) closeMenu(); else if (drawerBlock) closeDrawer(); else if ($("#q").value) { $("#q").value = ""; render(); } }
});
window.addEventListener("beforeunload", e => { if (dirty && REMOTE) { e.preventDefault(); e.returnValue = ""; } });
(async () => {
  setSync("busy", "Загружаю…");
  try { await load(); setSync("ok", REMOTE ? "Сохранено" : "Локальный режим"); }
  catch (e) { doc = seed(); base = clone(doc); setSync("err", "Нет доступа к диз-доку (" + e.message + ")"); }
  const target = new URLSearchParams(location.hash.slice(1));
  view = { kind: "sec", id: doc.sections[0] && doc.sections[0].id };
  render();
  if (target.get("s")) jump(target.get("s"), target.get("b"));
  askName(false);
  if (REMOTE) setInterval(pull, 20000);
})();
</script>
</body>
</html>
