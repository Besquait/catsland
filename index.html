<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cats Land — диз-док</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{
  /* colors */
  --bg:#EFE6D6;--card:#FFF4E2;--ink:#1B2350;--ink2:#565C82;--ink3:#9A9AAE;--line:#D9CDB8;--edge:var(--ink);--sh:var(--ink);--white:#FFFFFF;
  --accent:#FF5C8A;--accent2:#FFE1E9;--teal:#12B5A6;--sun:#FFC83D;--marker:#FFE58A;
  --idea:#B38BFF;--work:#FFC83D;--test:#5EC8F2;--done:#3CC46A;--redo:#F2553D;
  --ai:#8A6CFF;--ai-soft:#E9E1FF;
  --soft1:#FFE1E9;--soft2:#FFF1C9;--soft3:#FFE1DA;--soft4:#DDF5E3;--soft-blue:#E3F1FF;--soft-violet:#EFE4FF;
  /* borders: thin for controls, thick for cards and panels */
  --b1:2px;--b2:3px;
  /* hand-drawn corners: small (chips, pills), medium (buttons, fields, board cards), large (cards, panels, modals) */
  --r1:6px 8px 5px 7px;--r2:8px 11px 7px 10px;--r3:14px 18px 12px 16px;
  /* flat offset shadows */
  --sh1:2px 2px 0 var(--sh);--sh2:4px 4px 0 var(--sh);--sh3:7px 7px 0 var(--sh);--shadow:var(--sh2);
  /* type: Rubik for text, Martian Mono for labels and counters */
  --fs1:11px;--fs2:13px;--fs3:15px;--fs4:16px;--fs5:18px;--fs6:22px;--fs7:34px;
  --sans:Rubik,system-ui,sans-serif;--mono:"Martian Mono",monospace;
}

/* riso sticker style: cream paper, 3px ink outline, uneven corners, hard offset shadow, small tilts */

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs4)/1.6 var(--sans);
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px);background-size:7px 7px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
nav{margin:16px 0 16px 16px;padding:20px 14px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:4px;
  background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);box-shadow:var(--shadow)}
.logo{font:800 var(--fs6)/1.05 var(--sans);padding:4px 10px 18px;transform:rotate(-2deg);letter-spacing:.3px}
.logo span{color:var(--accent)}
.nl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r2);color:var(--ink2);cursor:pointer;font-weight:700;border:var(--b1) solid transparent;transition:transform .08s}
.nl:hover{border-color:var(--edge);color:var(--ink);transform:rotate(-.6deg)}
.nl.on{background:var(--sun);color:var(--ink);border-color:var(--edge);box-shadow:var(--sh2);transform:rotate(-1deg)}
.nl .dot{width:11px;height:11px;border-radius:3px;flex:none;border:var(--b1) solid var(--edge)}
.nl .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .c{font:700 var(--fs1)/1 var(--mono);color:inherit;opacity:.7}
.lbl{font:700 var(--fs1)/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:20px 10px 8px;display:flex;justify-content:space-between;align-items:center}
.lbl button{width:26px;height:26px;border-radius:var(--r1);background:var(--accent);color:var(--white);border:var(--b1) solid var(--edge);box-shadow:var(--sh1);font:800 var(--fs4)/1 var(--sans);display:grid;place-items:center;padding:0}
.lbl button:active{transform:translate(2px,2px);box-shadow:none}
.foot{margin-top:auto;padding:14px 10px 0;font-size:var(--fs2);color:var(--ink3);display:flex;flex-direction:column;gap:6px;border-top:var(--b1) dashed var(--line)}
.foot a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sync{display:flex;gap:7px;align-items:center;font:700 var(--fs1)/1.3 var(--mono)}
.sync i{width:9px;height:9px;border-radius:2px;border:var(--b1) solid var(--edge);background:var(--done)}
.sync i.busy{background:var(--work)} .sync i.err{background:var(--redo)}
main{padding:44px 40px 120px;container-type:inline-size;min-width:0}
.page{max-width:880px;margin:0 auto}
.head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.emoji{font-size:40px;cursor:pointer;border-radius:var(--r2);padding:2px 6px;border:var(--b2) solid transparent;transform:rotate(-4deg)}
.emoji:hover{border-color:var(--edge);background:var(--card);box-shadow:var(--sh2)}
.title{flex:1;font:800 var(--fs7)/1.1 var(--sans);border:0;background:none;outline:none;padding:0;min-width:0;letter-spacing:-.2px}
.sub{color:var(--ink2);margin:0 0 26px}
.status{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
.status button{padding:6px 12px 5px;border-radius:var(--r2);font:700 var(--fs1)/1.2 var(--mono);color:var(--ink2);border:var(--b1) solid var(--edge);background:var(--card)}
.status button:hover{transform:rotate(-1deg)}
.status button.on{color:var(--ink);box-shadow:var(--sh2);transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);padding:16px 20px 18px;box-shadow:var(--shadow);position:relative}
.grid>.card:nth-child(4n+1){transform:rotate(-.35deg)} .grid>.card:nth-child(4n+2){transform:rotate(.4deg)}
.grid>.card:nth-child(4n+3){transform:rotate(.25deg)} .grid>.card:nth-child(4n){transform:rotate(-.3deg)}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:var(--fs3);font-weight:700;display:flex;align-items:center;gap:8px}
.card .hint{font-size:var(--fs2);color:var(--ink3);margin:0 0 8px}
.card h3 .x{margin-left:auto;color:var(--ink3);font-weight:600;font-size:var(--fs2);opacity:0}
.card:hover h3 .x{opacity:1}
textarea.f{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:52px;padding:0;line-height:1.6;overflow:hidden}
textarea.f::placeholder,.it textarea::placeholder{color:var(--ink3)}
.cl{display:flex;flex-direction:column;gap:2px}
.it{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.it input[type=checkbox]{appearance:none;width:19px;height:19px;border:var(--b1) solid var(--edge);border-radius:var(--r1);margin-top:4px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
.it input[type=checkbox]:checked{background:var(--done);box-shadow:var(--sh1)}
.it input[type=checkbox]:checked:after{content:"✓";color:var(--ink);font-size:var(--fs2);font-weight:900}
.it textarea{flex:1;border:0;outline:none;background:transparent;resize:none;padding:0;line-height:1.6;min-height:25px;overflow:hidden}
.it.done textarea{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.it .del{color:var(--ink3);opacity:0;font-size:var(--fs5);line-height:1}
.it .del:hover{color:var(--redo)}
.it:hover .del{opacity:1}
.add{color:var(--ink3);font:700 var(--fs1)/1 var(--mono);padding:8px 0 2px;text-align:left}
.add:hover{color:var(--accent)}
.sw{display:flex;flex-wrap:wrap;gap:14px}
.s{width:92px;text-align:center;font-size:var(--fs2);color:var(--ink2)}
.s label{display:block;width:92px;height:64px;border-radius:var(--r2);cursor:pointer;border:var(--b2) solid var(--edge);box-shadow:var(--sh2);position:relative}
.s:nth-child(odd) label{transform:rotate(-2deg)} .s:nth-child(even) label{transform:rotate(1.5deg)}
.s input[type=color]{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.s input.n{width:100%;border:0;background:none;text-align:center;outline:none;font:700 var(--fs1)/1 var(--mono);margin-top:8px;color:var(--ink2)}
.s .rm{font-size:var(--fs1);color:var(--ink3)}
.addc{width:92px;height:64px;border-radius:var(--r2);border:var(--b2) dashed var(--edge);color:var(--ink2);font:800 var(--fs6)/1 var(--sans)}
.addc:hover{background:var(--card);color:var(--accent)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.gc{background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s}
.gc:nth-child(3n+1){transform:rotate(-1deg)} .gc:nth-child(3n+2){transform:rotate(.8deg)} .gc:nth-child(3n){transform:rotate(-.4deg)}
.gc:hover{transform:translate(-2px,-3px) rotate(-1.5deg);box-shadow:var(--sh3)}
.gc:active{transform:translate(3px,3px);box-shadow:var(--sh1)}
.gc .n{font:800 var(--fs5)/1.2 var(--sans);margin:8px 0 4px}
.gc .d{color:var(--ink2);font-size:var(--fs3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.gc .m{display:flex;gap:10px;margin-top:10px;font:700 var(--fs1)/1.3 var(--mono);color:var(--ink3)}
.pill{padding:3px 9px 2px;border-radius:var(--r1);color:var(--ink);font:700 var(--fs1)/1.4 var(--mono);border:var(--b1) solid var(--edge);display:inline-block;transform:rotate(-2deg)}
.newg{border:var(--b2) dashed var(--edge);box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--ink2);font:800 var(--fs3)/1.3 var(--sans);min-height:130px;text-align:center}
.newg:hover{background:var(--card);box-shadow:var(--shadow)}
.danger{color:var(--redo);font:700 var(--fs1)/1 var(--mono);margin-top:30px}
.banner{background:var(--accent2);border:var(--b2) solid var(--edge);border-radius:var(--r3);box-shadow:var(--sh2);padding:10px 14px;font-size:var(--fs3);margin-bottom:24px;transform:rotate(-.4deg)}
.banner a{color:var(--accent);font-weight:700;cursor:pointer}
.menu{position:fixed;z-index:30;background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.menu button{font-size:var(--fs6);padding:4px;border-radius:var(--r1)}
.menu button:hover{background:var(--sun)}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);padding:28px;width:430px;max-width:100%;box-shadow:var(--sh3);transform:rotate(-1deg)}
.modal h3{margin:0 0 8px;font:800 var(--fs6)/1.15 var(--sans)}
.modal p{color:var(--ink2);margin:0 0 14px;font-size:var(--fs3)}
.modal input{width:100%;border:var(--b1) solid var(--edge);border-radius:var(--r2);padding:10px 12px;background:var(--bg);outline:none;font:700 var(--fs2)/1.3 var(--mono)}
.modal input:focus{box-shadow:3px 3px 0 var(--accent)}
.btn{background:var(--sun);color:var(--ink);font:800 var(--fs3)/1 var(--sans);padding:12px 20px 10px;border:var(--b2) solid var(--edge);border-radius:var(--r3);box-shadow:var(--sh2);margin-top:16px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:var(--sh3)}
.btn:active{transform:translate(3px,3px);box-shadow:var(--sh1)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--sun);color:var(--ink);border:var(--b2) solid var(--edge);box-shadow:var(--sh2);padding:9px 16px;border-radius:var(--r2);font:700 var(--fs1)/1.3 var(--mono);opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.burger{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;z-index:35;width:270px;margin:12px;height:calc(100vh - 24px);transform:translateX(-110%);transition:.2s}nav.open{transform:none}
  .burger{display:block;position:fixed;top:12px;left:12px;z-index:34;width:44px;height:44px;border-radius:var(--r2);background:var(--sun);color:var(--ink);border:var(--b2) solid var(--edge);box-shadow:var(--sh2);font-weight:900}
  main{padding:72px 16px 100px}.grid{grid-template-columns:1fr}.grid>.card{transform:none!important}.title{font-size:26px}}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:var(--b1) dashed var(--line)}
.bt{flex:1;min-width:0;border:0;background:none;outline:none;font:700 var(--fs3)/1.3 var(--sans);padding:0;color:var(--ink)}
.bt::placeholder{color:var(--ink3)}
.cnt{font:700 var(--fs1)/1 var(--mono);color:var(--ink3)}
.bc{display:flex;gap:3px;opacity:0;transition:opacity .12s}
.card:hover .bc,.card:focus-within .bc{opacity:1}
.bc button{width:27px;height:27px;border-radius:var(--r1);color:var(--ink2);font-size:var(--fs3);border:var(--b1) solid transparent}
.bc button:hover{border-color:var(--edge);background:var(--sun);color:var(--ink)}
.bc button:disabled{opacity:.3;cursor:default}
.addbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px;color:var(--ink3);font:700 var(--fs1)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.addbar button{padding:9px 14px 8px;border-radius:var(--r2);border:var(--b1) dashed var(--edge);color:var(--ink);font:700 var(--fs3)/1 var(--sans);text-transform:none;letter-spacing:0}
.addbar button:hover{border-style:solid;background:var(--card);box-shadow:var(--sh2);transform:rotate(-1deg)}
textarea.sub{display:block;width:100%;border:0;background:none;outline:none;resize:none;padding:0;font:inherit;color:var(--ink2);overflow:hidden;margin:0 0 26px}
textarea.sub::placeholder{color:var(--ink3)}
.rich{min-height:52px;outline:none;line-height:1.6;word-break:break-word}
.rich:empty:before{content:attr(data-ph);color:var(--ink3);pointer-events:none}
.rich b,.rich strong{font-weight:700}
.rich mark{background:var(--marker);color:inherit;padding:0 2px;border-radius:3px}
.rich h4{font:800 var(--fs5)/1.3 var(--sans);margin:10px 0 4px}
.rich ul,.rich ol{margin:4px 0;padding-left:24px}
.rich li{margin:2px 0}
.rich li::marker{font-weight:700;color:var(--accent)}
.tb{display:none;gap:3px;flex-wrap:wrap;margin:-2px 0 8px}
.tb button{min-width:28px;height:26px;padding:0 6px;border-radius:var(--r1);border:var(--b1) solid var(--line);font:700 var(--fs2)/1 var(--sans);color:var(--ink2);background:var(--bg)}
.tb button:hover{border-color:var(--edge);background:var(--sun);color:var(--ink)}
.tb .f-italic{font-style:italic}.tb .f-underline{text-decoration:underline}.tb .f-strikeThrough{text-decoration:line-through}
.tb .f-mark{background:var(--marker)}
.empty{color:var(--ink3);text-align:center}
@media (max-width:820px){.bc{opacity:1}}

/* floating block panel: always at the bottom of the screen */
.addbar{position:static;margin:26px auto 0;width:max-content;max-width:100%;background:var(--card);border:var(--b2) solid var(--edge);border-radius:var(--r3);
  box-shadow:var(--sh2);padding:8px 10px;gap:6px;justify-content:center}
.addbar>span{padding:0 6px 0 2px;color:var(--ink);font:700 var(--fs1)/1 var(--mono)}
.addbar button{border:var(--b1) solid transparent;padding:7px 10px 6px;font:700 var(--fs2)/1 var(--sans);display:flex;gap:5px;align-items:center}
.addbar button i{font-style:normal;font-size:var(--fs3);width:16px;text-align:center}
.addbar button:hover{border-style:solid;border-color:var(--edge);background:var(--sun);color:var(--ink);box-shadow:var(--sh1);transform:rotate(-1deg)}
.addbar .ready{background:var(--accent);color:var(--white);border-color:var(--edge)}
.pageact{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:16px;border-top:var(--b1) dashed var(--line)}
.pageact button{font:700 var(--fs1)/1 var(--mono);color:var(--ink2);padding:8px 10px;border:var(--b1) dashed var(--line);border-radius:var(--r1)}
.pageact button:hover{border-color:var(--edge);color:var(--ink)}
.pageact .danger{margin:0 0 0 auto;color:var(--redo)}
/* search + section labels */
.search{margin:0 4px 6px;padding:8px 10px;border:var(--b1) solid var(--edge);border-radius:var(--r2);background:var(--bg);outline:none;font:500 var(--fs3)/1.2 var(--sans)}
.search:focus{box-shadow:3px 3px 0 var(--accent)}
.lbli{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;letter-spacing:inherit;text-transform:uppercase;color:inherit;padding:0}
.lbli:focus{color:var(--ink)}
.none{font-size:var(--fs2);color:var(--ink3);padding:4px 10px}
/* blocks */
.hblock{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:14px 0 -4px;padding-bottom:6px;border-bottom:var(--b2) solid var(--edge)}
.hblock:hover .bc{opacity:1}
.ht{flex:1;border:0;background:none;outline:none;font:800 var(--fs6)/1.2 var(--sans);color:var(--ink);padding:0}
.drag{cursor:grab;color:var(--ink3);padding:4px 3px;font-size:var(--fs3);user-select:none}
.card.dragging{opacity:.45}
.card.over,.hblock.over{outline:3px dashed var(--accent);outline-offset:3px}
.tone{font-size:var(--fs5);line-height:1;padding:2px}
.k-note.t-idea{background:var(--soft2)}.k-note.t-info{background:var(--soft-blue)}.k-note.t-question{background:var(--soft-violet)}.k-note.t-warn{background:var(--soft3)}.k-note.t-good{background:var(--soft4)}
.tbh{margin-left:auto;align-self:center;font:700 var(--fs1)/1 var(--mono);color:var(--ink3)}
.tw{overflow-x:auto;margin:0 -4px}
.tw table{border-collapse:collapse;width:100%;min-width:360px}
.tw th,.tw td{border:var(--b1) solid var(--line);padding:0;vertical-align:top;position:relative}
.tw th{background:var(--sun)}
.tw th input{width:100%;border:0;background:none;outline:none;padding:7px 22px 6px 9px;font:700 var(--fs2)/1.3 var(--sans);color:var(--ink)}
.tw td textarea{width:100%;border:0;background:none;outline:none;resize:none;padding:7px 9px;font:400 var(--fs3)/1.45 var(--sans);overflow:hidden;display:block;min-height:34px}
.tw td textarea:focus,.tw th input:focus{background:color-mix(in srgb,var(--sun) 18%,transparent)}
.tw .ctl{width:30px;border:0;text-align:center;vertical-align:middle;background:none}
.tw .ctl button{font:800 var(--fs3)/1 var(--sans);color:var(--ink2);width:24px;height:24px;border-radius:var(--r1)}
.tw .ctl button:hover{background:var(--sun);color:var(--ink)}
.x{position:absolute;right:3px;top:5px;color:var(--ink3);opacity:0;font-size:var(--fs3);line-height:1;width:18px;height:18px;border-radius:var(--r1)}
th:hover .x,tr:hover .x,figure:hover .x,.lk:hover .x,.bch:hover .x{opacity:1}
.x:hover{color:var(--redo);background:var(--bg)}
.tw .ctl .x{position:static}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.imgs figure{margin:0;position:relative;background:var(--bg);border:var(--b1) solid var(--edge);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh2)}
.imgs figure:nth-child(odd){transform:rotate(-1deg)}.imgs figure:nth-child(even){transform:rotate(.8deg)}
.imgs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--line)}
.imgs .x{background:var(--card);top:6px;right:6px}
.imgs .cap{width:100%;border:0;border-top:var(--b1) solid var(--line);background:var(--card);outline:none;padding:5px 8px;font:500 var(--fs2)/1.3 var(--sans)}
.addimg{border:var(--b1) dashed var(--edge);border-radius:var(--r2);min-height:120px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:10px;text-align:center}
.addimg button{font:700 var(--fs2)/1 var(--sans);padding:7px 10px;border-radius:var(--r1);border:var(--b1) solid var(--edge);background:var(--sun);color:var(--ink)}
.addimg button+button{background:var(--card);color:var(--ink)}
.addimg span{font-size:var(--fs1);color:var(--ink3)}
.zoom{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 80%,transparent);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border:var(--b2) solid var(--white);border-radius:var(--r2)}
.lks{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;gap:8px;align-items:center;position:relative}

/* AI marks are the owner's tool: for everyone else they read as plain text */
body:not(.owner) cite[data-ai]{background:none;box-shadow:none;padding:0}

/* six-column grid: a block is half (3), a wide block the whole row, a mechanic link a compact third (2) */

@media (min-width:821px) and (max-width:1100px){.grid>.card.k-mech{grid-column:span 3}}

<script>
/* ===== storage: private GitHub repo, key in the link (#k=...) or localStorage ===== */
const CFG = { repo: "Besquait/catsland-gdd", branch: "main", path: "data/gdd.json" };
const H = new URLSearchParams(location.hash.slice(1));
const LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const LSset = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const SS = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const SSset = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
if (H.get("k")) { LSset("cl_key", H.get("k")); history.replaceState(null, "", location.pathname); }
const KEY = H.get("k") || LS("cl_key");
const REMOTE = !!KEY;
const GH = "https://api.github.com/repos/" + CFG.repo;
const api = (p, o = {}) => fetch(GH + p, { ...o, cache: "no-store",
  headers: { Authorization: "Bearer " + KEY, Accept: "application/vnd.github+json" } });
const enc = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 32768) r += String.fromCharCode(...b.subarray(i, i + 32768)); return btoa(r); };
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 9);

let doc, base, sha = null, dirty = false, saving = false, timer = null, what = new Set();

/* ===== blocks and templates ===== */
function B(kind, title, extra) { return Object.assign({ id: uid(), kind, title, wide: false }, extra || {}); }
const TX = (title, ph, wide) => B("text", title, { ph, wide: !!wide, text: "" });
const RL = (title, ph, items) => B("rules", title, { ph, items: (items || []).map(t => ({ id: uid(), t })) });
const CL = (title, ph, items) => B("list", title, { ph, items: (items || []).map(t => ({ id: uid(), t, done: false })) });
function TB_(title, heads, rows, extra) {
  const cols = heads.map(t => ({ id: uid(), t }));
  return B("table", title, Object.assign({ wide: true, cols, rows: (rows || [heads.map(() => "")]).map(r => ({ id: uid(), c: Object.fromEntries(r.map((v, i) => [cols[i].id, v])) })) }, extra || {}));
}
const IM = (title, extra) => B("images", title, Object.assign({ wide: true, imgs: [] }, extra || {}));
const NT = (tone, title, ph) => B("note", title, { tone, ph, text: "", wide: true });
const LK = title => B("links", title, { links: [{ id: uid(), t: "", u: "" }] });
const HD = title => B("heading", title, { wide: true });
const PL = (title, cs) => B("palette", title, { wide: true, colors: cs.map(([c, n]) => ({ id: uid(), c, n })) });
const KB = (title, cols) => B("board", title, { wide: true, cols: cols.map(([t, cards]) => ({ id: uid(), t, cards: (cards || []).map(x => ({ id: uid(), t: x })) })) });

const KINDS = {
  text: ["¶", "Текст", () => TX("Новый раздел", "Пишите здесь…")],
  list: ["☑", "Чеклист", () => CL("Список", "Пункт")],
  rules: ["📏", "Правила", () => RL("Правила", "Как должно работать")],
  table: ["▦", "Таблица", () => TB_("Таблица", ["Колонка", "Колонка"])],
  images: ["🖼", "Картинки", () => IM("Картинки")],
  note: ["💡", "Заметка", () => NT("idea", "Заметка", "Идея, вопрос или что-то важное")],
  links: ["🔗", "Ссылки", () => LK("Ссылки")],
  board: ["🗂", "Доска задач", () => KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])],
  palette: ["🎨", "Палитра", () => PL("Цвета", [["#FF5C8A", "Цвет"]])],
  mech: ["⚙️", "Механика", () => MC("Новая механика")],
  heading: ["H", "Заголовок раздела", () => HD("Новый раздел")],
};
const READY = [
  ["🎮", "Управление", () => TB_("Управление", ["Кнопка", "Действие"], [["WASD", "Бег"], ["Пробел", "Прыжок"], ["", ""]])],
  ["📏", "Параметры игры", () => TB_("Параметры", ["Параметр", "Значение"], [["Игроков", "2–12"], ["Длительность раунда", ""], ["Раундов в матче", ""]], { wide: false })],
  ["🏆", "Награды", () => TB_("Награды", ["Место", "Награда"], [["1", ""], ["2", ""], ["3", ""]], { wide: false })],
  ["🧮", "Очки", () => TB_("Очки", ["Действие", "Очки"], [["", ""]], { wide: false })],
  ["📈", "Уровни сложности", () => TB_("Уровни сложности", ["Уровень", "Что меняется", "Время / скорость"], [["1", "", ""], ["2", "", ""], ["3", "", ""]])],
  ["🔊", "Звуки", () => TB_("Звуки", ["Событие", "Звук", "Заметка"], [["Старт раунда", "", ""], ["Победа", "", ""]])],
  ["✨", "Эффекты (сочность)", () => CL("Эффекты", "Что должно ощущаться", ["Тряска камеры при падении", "Конфетти на победе"])],
  ["❓", "Открытые вопросы", () => NT("question", "Открытые вопросы", "Что ещё не решили")],

  ["🖼", "Референсы", () => IM("Референсы")],
  ["🗂", "Доска задач", () => KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])],
];
const PAGE_TPL = [
  ["📄", "Пустая страница", "Чистый лист", () => [TX("Текст", "Пишите здесь…", true)]],
  ["⚙️", "Механика", "Как работает одна система", () => [TX("Суть", "В двух словах…", true), TX("Как работает", "1. …", true), TB_("Параметры", ["Параметр", "Значение", "Комментарий"]), NT("question", "Открытые вопросы"), CL("Доделать", "Что нужно сделать")]],
  ["🐱", "Персонаж", "Внешность, характер, способности", () => [IM("Как выглядит"), TX("Характер", "Какой он, как двигается…"), CL("Анимации", "Анимация", ["Бег", "Прыжок", "Победа"]), TB_("Способности", ["Способность", "Что делает", "Перезарядка"]), TB_("Звуки", ["Когда", "Какой звук"])]],
  ["🗺️", "Локация / карта", "Мудборд, зоны, опасности", () => [IM("Мудборд"), TX("Описание", "Где мы и что вокруг", true), TB_("Зоны", ["Зона", "Что тут происходит", "Опасности"]), CL("Читаемость", "Проверка", ["Видно, куда бежать", "Опасности заметны заранее"])]],
  ["🎁", "Предметы и награды", "Таблица предметов", () => [TB_("Предметы", ["Предмет", "Редкость", "Как получить", "Что даёт"]), NT("info", "Правила выдачи")]],
  ["🖥️", "Интерфейс", "Экраны, HUD, тексты", () => [IM("Макеты"), CL("Элементы HUD", "Элемент", ["Таймер", "Уровень", "Сколько осталось игроков"]), TB_("Экраны", ["Экран", "Что показывает", "Когда появляется"]), TB_("Тексты", ["Где", "Текст"])]],
  ["🎨", "Арт-стиль", "Мудборд, палитра, можно/нельзя", () => [IM("Мудборд"), PL("Палитра", [["#FFF4E2", "Фон"], ["#1B2350", "Контур"], ["#FF5C8A", "Акцент"]]), CL("Можно", "Делаем так"), CL("Нельзя", "Так не делаем")]],
  ["🎵", "Звук и музыка", "События и настроение", () => [TX("Настроение", "Какая музыка, темп", true), TB_("Звуки", ["Событие", "Звук", "Заметка"]), LK("Референсы")]],
  ["🗓️", "План работ", "Доска задач и этапы", () => [KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]]), TB_("Этапы", ["Этап", "Что входит", "Срок"])]],
  ["🧪", "Плейтест", "Что заметили игроки", () => [TB_("Кто играл", ["Дата", "Игроки", "Оценка веселья (1–5)"]), CL("Понравилось", "Что зашло"), CL("Мешало", "Что не зашло"), NT("warn", "Баги", "Что сломалось"), TX("Выводы", "Что меняем", true)]],
  ["💰", "Магазин", "Товары и цены", () => [TB_("Товары", ["Товар", "Цена", "Что даёт", "Где продаётся"]), NT("info", "Принципы", "Что продаём и что никогда не продаём")]],
  ["✨", "Мудборд", "Картинки и ссылки", () => [IM("Картинки"), LK("Ссылки"), TX("Что берём", "Что нравится в этих примерах", true)]],
];
const GAME_TPL = [
  ["🎮", "Мини-игра", "Стандартный шаблон", () => [TX("Суть", "Игроки … и побеждает тот, кто …", true), IM("Как выглядит"), TX("Как работает", "1. …", true),
    READY[1][2](), READY[0][2](), TX("Победа и поражение", "Когда раунд заканчивается"), KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])]],
  ["🟨", "На выбывание", "Как Block Party: остаётся последний", () => [TX("Суть", "Кто не успел — выбывает", true), TX("Как работает", "Лобби\n1. …", true), READY[1][2](), READY[4][2](),
    NT("question", "Что происходит с выбывшими", "Смотровая площадка, наблюдение, …"), READY[9][2](), KB("Задачи", [["Надо сделать"], ["В работе"], ["Переделать"], ["Готово"]])]],
  ["🏁", "Гонка / паркур", "Кто первый добежит", () => [TX("Суть", "", true), IM("Трасса"), TB_("Чекпоинты", ["№", "Где", "Что сложного"]), READY[0][2](), READY[2][2](), CL("Доделать", "Что нужно сделать")]],
  ["⚔️", "Командная", "Команда против команды", () => [TX("Суть", "", true), TB_("Команды", ["Команда", "Цвет", "Сколько игроков"], [["Красные", "#F2553D", ""], ["Синие", "#3D7BF2", ""]]), TX("Цель", "Что нужно сделать команде", true),
    READY[3][2](), NT("warn", "Баланс", "Как не дать одной команде разгромить другую"), CL("Доделать", "Что нужно сделать")]],
  ["🎯", "На очки", "Кто больше наберёт за время", () => [TX("Суть", "", true), READY[3][2](), READY[1][2](), READY[2][2](), CL("Доделать", "Что нужно сделать")]],
  ["📄", "Пустая", "Только суть", () => [TX("Суть", "", true)]],
];
const STATUS = { idea: ["Идея", "var(--idea)"], work: ["В работе", "var(--work)"], test: ["Плейтест", "var(--test)"], done: ["Готово", "var(--done)"], redo: ["Переделать", "var(--redo)"] };
const TONES = { idea: ["💡", "Идея"], info: ["📌", "Заметка"], question: ["❓", "Вопрос"], warn: ["⚠️", "Важно"], good: ["✅", "Решено"] };
const MECH_TPL = (summary) => [Object.assign(TX("Суть", "Что это и зачем — 1–2 предложения", true), summary ? { text: summary, html: true } : {}),
  TX("Как работает", "По шагам: когда запускается → что происходит → чем заканчивается", true),
  TB_("Баланс и параметры", ["Параметр", "Значение", "Ед.", "На что влияет", "Комментарий"]),
  RL("Правила и крайние случаи", "Как должно работать"),
  NT("question", "Открытые вопросы", "Что ещё не решили"), CL("Доделать", "Что нужно сделать")];
const MC = (title, text) => B("mech", title, { text: text || "", html: true, link: null, ph: "Коротко: что делает механика" });
const mechPage = (title, summary) => ({ id: uid(), emoji: "⚙️", title: title || "Новая механика", sub: "", status: "idea", tags: [], blocks: MECH_TPL(summary).map(norm) });
const PRIO = { "": "без приоритета", g: "низкий", y: "средний", r: "высокий" };
const PRIO_NEXT = { "": "g", g: "y", y: "r", r: "" };
const LEXP = new Set();
const ALL = () => doc.pages.concat(doc.games, doc.mechs || []);
const SPECIAL = new Set(["games", "mechs", "work", "ai", "sitestyle", "balance", "sounds"]);
const isBal = b => b.kind === "table" && /баланс|параметр/i.test(b.title || "") && !/истори/i.test(b.title || "");
/* every balance table of every page in one place, editable, with the latest changes under each */
function balanceHTML() {
  const pgs = ALL().filter(pg => pg.blocks.some(isBal));
  const groups = doc.games.map(g => [esc(g.emoji) + " " + esc(g.title), pgs.filter(pg => pg === g || (where(pg.id) === "mechs" && mechGames(pg).includes(g)))])
    .concat([["Лобби и общее", pgs.filter(pg => where(pg.id) !== "games" && !(where(pg.id) === "mechs" && mechGames(pg).length))]]).filter(([, l]) => l.length);
  const card = pg => pg.blocks.filter(isBal).map(b => { const p = where(pg.id) + "." + pg.id + ".blocks." + b.id;
    const rec = (pg.hist || []).filter(h => h.blk === b.id).flatMap(h => h.lines.filter(l => l.k === "c").map(l => [h, l])).slice(0, 4);
    return `<div class="card k-table wide" data-block="${b.id}"><div class="bh"><a data-go="${pg.id}"><b>${esc(pg.emoji)} ${esc(pg.title)}</b> · ${esc(b.title)} →</a></div>${bodyHTML(p, b)}
      ${rec.length ? `<div class="recent">${rec.map(([h, l]) => `<div>${esc(l.l)}: <del>${esc(l.a || "—")}</del> → <ins>${esc(l.b || "—")}</ins> <i>${ddm(h.at)} · ${esc(h.by)}</i>${h.why ? " — " + esc(h.why) : ""}</div>`).join("")}</div>` : ""}</div>`; }).join("");
  return `<div class="bal">${groups.map(([t, l]) => `<h2>${t}</h2>${l.map(card).join("")}`).join("") || `<p class="hint">Нет таблиц баланса. Они появляются сами у каждой механики («Баланс и параметры»).</p>`}</div>`;
}
/* the site's own style guide: tokens are read from :root, samples use the real classes */
function styleGuide() {
  const v = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
  const sw = (n, t) => `<div class="sgs"><i style="background:var(--${n})"></i><b>--${n}</b><span>${v(n)} · ${t}</span></div>`;

      <li>Рамки: тонкая у кнопок и полей, толстая у карточек и окон. Скругления «от руки» трёх размеров.</li>

    ${grp("Основа", "", [["bg", "фон страницы"], ["card", "карточки"], ["ink", "текст, рамки, тени"], ["ink2", "второстепенный текст"], ["ink3", "подсказки"], ["line", "разделители"], ["white", "текст на красном"]].map(x => sw(...x)).join(""))}
    ${grp("Акценты", "", [["accent", "главный акцент"], ["sun", "активная кнопка, выбор"], ["teal", "ссылки, редко"], ["marker", "маркер в тексте"], ["ai", "всё про ИИ"], ["ai-soft", "фон пометки ИИ"]].map(x => sw(...x)).join(""))}
    ${grp("Статусы", "Одинаковые у игр, механик и колонок доски", Object.entries(STATUS).map(([k, [t]]) => sw(k, t)).join("") + [["g", "низкий", "done"], ["y", "средний", "sun"], ["r", "высокий", "redo"]].map(([, t, c]) => `<div class="sgs"><i style="background:var(--${c});border-radius:50%;width:22px;height:22px"></i><b>приоритет</b><span>${t}</span></div>`).join(""))}
    ${grp("Пастель", "Шапки колонок доски и таблиц, подложки", [["soft1", "колонка 1, розовая"], ["soft2", "колонка 2, шапка таблицы"], ["soft3", "колонка 3"], ["soft4", "колонка 4, «готово»"], ["soft-blue", "заметка-инфо"], ["soft-violet", "заметка-вопрос"], ["accent2", "мягкий акцент"]].map(x => sw(...x)).join(""))}
    ${grp("Рамки, углы, тени", "", ["b1", "b2"].map(n => `<div><div class="box" style="border-width:var(--${n});border-radius:var(--r2)"></div><span class="tk">--${n} · ${v(n)}</span></div>`).join("")
      + ["r1", "r2", "r3"].map(n => `<div><div class="box" style="border-radius:var(--${n})"></div><span class="tk">--${n}</span></div>`).join("")
      + ["sh1", "sh2", "sh3"].map(n => `<div><div class="box" style="box-shadow:var(--${n});border-radius:var(--r2)"></div><span class="tk">--${n} · ${v(n)}</span></div>`).join(""))}
    <h3>Шрифты</h3><div class="ty">${[1, 2, 3, 4, 5, 6, 7].map(i => `<div style="font:${i > 5 ? 800 : i === 1 ? 700 : 400} var(--fs${i})/1.2 ${i === 1 ? "var(--mono)" : "var(--sans)"}">--fs${i} · ${v("fs" + i)} — ${i === 1 ? "ПОДПИСИ И СЧЁТЧИКИ" : i > 5 ? "Заголовок" : "Обычный текст диз-дока"}</div>`).join("")}</div>
    ${grp("Кнопки и переключатели", "", `<button class="btn" style="margin:0">Главная кнопка</button><button class="back">← Вторичная</button>
      <div class="mfilt" style="margin:0"><button class="on">Выбрано<b>3</b></button><button>Не выбрано<b>1</b></button></div>

   The current line is read from the DOM (text before the caret up to the last <br> or block start), so it works in every browser. */
function lineBefore(root) {
  const r = getSelection().getRangeAt(0).cloneRange(); r.setStart(root, 0);
  const d = document.createElement("div"); d.appendChild(r.cloneContents());
  let t = "";
  const walk = n => { for (const c of n.childNodes) {
    if (c.nodeType === 3) t += c.nodeValue;
    else if (c.tagName === "BR") t += "\n";
    else { if (/^(DIV|P|LI|H4|UL|OL)$/.test(c.tagName) && t && !t.endsWith("\n")) t += "\n"; walk(c); }
  } };
  walk(d);

}
function autoList(e) {
  const sel = getSelection(), root = e.target;
  if (!sel.rangeCount || !sel.isCollapsed || sel.anchorNode.parentElement?.closest("li")) return;
  const lines = lineBefore(root), line = lines[lines.length - 1];
  const RX = /^(\s*)(?:(\d+)([.)])|([-•*–]))\s(.*)$/s;
  let m = line.match(RX);
  if (m && !m[5].trim()) { e.preventDefault(); for (let k = 0; k < line.length; k++) document.execCommand("delete"); document.execCommand("insertParagraph"); return; }   // empty item: leave the list, an empty line separates it from the text below
  // a line without its own number still belongs to the list above it (until an empty line)
  for (let k = lines.length - 2; !m && k >= 0 && line.trim(); k--) { if (!lines[k].trim()) break; m = lines[k].match(RX); }
  if (!m) return;
  e.preventDefault();

      if (legacy) { r.onPeerJoin(join); r.onPeerLeave(leave); }
      else { r.onPeerJoin = join; r.onPeerLeave = leave; }
      room = r; ui(); drawBar();
      setInterval(() => { if (JSON.stringify(hi()) !== lastHi) hello(); }, 3000);
      addEventListener("pagehide", () => { try { r.leave(); } catch (e) {} });
    } catch (e) { room = null; }
  }

  return {
    start,
    hello: () => { if (room) hello(); else drawBar(); },
    saved() {
      if (!room) return;
      const due = Date.now() + (fromInput ? 2000 : 300);
      if (docT && docDue <= due) return;
      clearTimeout(docT); docDue = due; docT = setTimeout(() => { docT = null; send("doc", payload(false)); }, due - Date.now());
    },
    rendered() { if (!room) return; if (JSON.stringify(hi()) !== lastHi) hello(); else drawBar(); peers.forEach((p, id) => drawCursor(id)); drawFoc(); },
    peers,
  };
})();

(async () => {
  try { await load(); } catch (e) { doc = seed(); base = clone(doc); setTimeout(() => sync("err", "Нет доступа: " + e.message), 0); }
  const before = JSON.stringify(doc);
  doc = migrate(doc);
  sigSync();
  if (REMOTE && FIRST) { const n = Date.now(); ALL().forEach(p => SEEN[p.id] = n); LSset(SEENK, JSON.stringify(SEEN)); }
  if (JSON.stringify(doc) !== before) save("обновление структуры");
  render(); askName(false);
  if (REMOTE) setInterval(pull, 20000);
  RT.start();
})();
</script>
